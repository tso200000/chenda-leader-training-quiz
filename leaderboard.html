<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公開成績｜晨達現場幹部培訓</title><style>
:root{--navy:#1f3e63;--navy2:#173454;--orange:#f39a14;--bg:#f4f7fa;--card:#fff;--line:#dbe3ec;--text:#1f2937;--muted:#6b7280;--good:#2f855a;--bad:#c53030}
*{box-sizing:border-box} body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);font-size:18px}
.topbar{height:14px;background:var(--navy)} .wrap{max-width:1080px;margin:auto;padding:26px 18px 42px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(31,62,99,.08);padding:30px}
h1,h2,h3{color:var(--navy)} h1{margin:0;font-size:36px}.sub{margin-top:8px;color:var(--muted);font-size:18px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.badge{background:var(--orange);color:#fff;font-weight:700;padding:10px 16px;border-radius:14px}
.btn{border:none;border-radius:12px;padding:12px 20px;font-size:18px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#eef3f8;color:var(--navy)}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin:10px 0;font-size:18px;cursor:pointer}
.choice.selected{border:2px solid var(--navy);background:#edf4fb}.progress{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--orange)}
.pill{display:inline-block;background:#eef3f8;color:var(--navy);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}
.hidden{display:none}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.score{font-size:64px;font-weight:900;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:18px}th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--navy);font-size:18px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.metric b{display:block;font-size:28px;color:var(--navy)}
.bar{height:12px;background:#e7edf4;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange)}
.note{color:var(--muted);font-size:16px;line-height:1.6}.error{color:var(--bad);font-weight:700}.good{color:var(--good);font-weight:700}.version{margin-top:24px;text-align:right;color:var(--muted);font-size:15px}
.admin-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px}.danger{background:var(--bad);color:#fff}.danger:disabled{background:#cbd5e1;cursor:not-allowed}.row-check,#selectAll{width:20px;height:20px;padding:0;cursor:pointer}.check-col{width:52px;text-align:center}
@media(max-width:720px){body{font-size:17px}.hero{align-items:flex-start;flex-direction:column}.hero-actions{width:100%;justify-content:flex-start}.grid2,.metric-grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}h1{font-size:30px}.sub,table,.btn{font-size:17px}.note{font-size:15px}}
</style></head><body><div class="topbar"></div><div class="wrap"><div class="card"><div class="hero"><div><h1>公開成績</h1><div class="sub">顯示本課程所有填寫人員的代號與成績；Email 永不公開</div></div><div class="hero-actions"><a class="btn secondary" href="leader-admin.html" style="text-decoration:none">← 返回管理中心</a><a class="btn secondary" href="course01.html" style="text-decoration:none">← 返回測驗</a></div></div><div id="status" class="note" style="margin:18px 0"></div><div id="adminTools" class="admin-tools hidden"><span id="selectedStatus">管理模式｜已勾選 0 筆</span><button id="deleteBtn" class="btn danger" type="button" disabled>刪除所選成績</button></div><table><thead><tr><th id="checkHeader" class="check-col hidden"><input id="selectAll" type="checkbox" aria-label="全選成績"></th><th>排名</th><th>代號</th><th>分數</th><th>答對</th><th>日期</th></tr></thead><tbody id="body"></tbody></table><div class="version">系統版本 V1.8｜更新日期 2026-10-02</div></div></div><script>
const API_URL="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec",courseId=new URLSearchParams(location.search).get('courseId')||'C01';
async function post(data){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});return r.json();}
function appendCell(tr,value,bold){const td=document.createElement('td');if(bold){const b=document.createElement('b');b.textContent=value;td.appendChild(b);}else td.textContent=value;tr.appendChild(td);}
function renderRows(rows,adminMode){const body=document.getElementById('body');body.innerHTML='';rows.forEach((x,i)=>{const tr=document.createElement('tr');if(adminMode){const td=document.createElement('td'),box=document.createElement('input');td.className='check-col';box.type='checkbox';box.className='row-check';box.value=x.rowId;box.setAttribute('aria-label','選取 '+(x.code||'匿名')+' 的成績');box.addEventListener('change',updateSelection);td.appendChild(box);tr.appendChild(td);}appendCell(tr,i+1);appendCell(tr,x.code||'匿名');appendCell(tr,x.score,true);appendCell(tr,x.correct+'/'+x.total);appendCell(tr,x.date);body.appendChild(tr);});}
function updateSelection(){const boxes=[...document.querySelectorAll('.row-check')],selected=boxes.filter(x=>x.checked).length;selectedStatus.textContent='管理模式｜已勾選 '+selected+' 筆';deleteBtn.disabled=!selected;selectAll.checked=boxes.length>0&&selected===boxes.length;selectAll.indeterminate=selected>0&&selected<boxes.length;}
async function load(){const st=document.getElementById('status'),token=sessionStorage.getItem('chendaAdminToken')||'';if(!API_URL){st.textContent='尚未設定雲端 API URL。';return}try{let rows=[],adminMode=false;if(token){const d=await post({action:'adminLeaderboard',token,courseId});if(d.ok){rows=Array.isArray(d.rows)?d.rows:[];adminMode=true;}else sessionStorage.removeItem('chendaAdminToken');}if(!adminMode){const r=await fetch(API_URL+'?action=leaderboard&courseId='+encodeURIComponent(courseId));if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();rows=Array.isArray(d.rows)?d.rows:[];}renderRows(rows,adminMode);adminTools.classList.toggle('hidden',!adminMode);checkHeader.classList.toggle('hidden',!adminMode);st.textContent=rows.length?'目前共有 '+rows.length+' 筆成績':'目前尚無成績資料';updateSelection();}catch(e){st.textContent='成績讀取失敗，請稍後重新整理。'}}
selectAll.addEventListener('change',()=>{document.querySelectorAll('.row-check').forEach(x=>x.checked=selectAll.checked);updateSelection();});
deleteBtn.addEventListener('click',async()=>{const token=sessionStorage.getItem('chendaAdminToken')||'',rowIds=[...document.querySelectorAll('.row-check:checked')].map(x=>x.value);if(!rowIds.length)return;if(!confirm('確定刪除已勾選的 '+rowIds.length+' 筆成績嗎？\n刪除後統計將立即重新計算。'))return;deleteBtn.disabled=true;try{const d=await post({action:'deleteSelected',token,rowIds});if(!d.ok){alert(d.error||'刪除失敗。');return;}alert('已刪除 '+d.deleted+' 筆成績，並保留於刪除備份。');await load();}catch(e){alert('目前無法連線後端。');}finally{updateSelection();}});
load();
</script></body></html>
