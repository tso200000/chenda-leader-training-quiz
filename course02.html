<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜第二堂課後測驗</title><style>
:root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:18px}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:18px}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:28px}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:34px}h2{font-size:28px;line-height:1.45}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-size:18px;font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px 20px;margin:12px 0;font-size:22px;line-height:1.5;cursor:pointer}.choice.sel{border:2px solid var(--n);background:#edf4fb}.quiz-actions{display:flex;justify-content:flex-end;margin-bottom:14px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}.choice{font-size:21px;padding:17px 16px}.w{padding:12px 10px}.c{padding:18px 14px}}
</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>工作安排與進度掌握</h1><div class="sub">第二堂｜課後測驗｜OWNER UAT 測試版</div></div><div class="badge">25題單選題</div></div><p>本頁用於主人實際作答與修題。分數暫以25題等權計算；交卷時會自動記錄第二堂考試日期與本次成績歷史。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">考試日期由系統自動記錄，考生不用輸入；Email 仍可留空。</p><div class="note" style="margin-top:18px;text-align:right">第二堂 OWNER UAT｜題庫 V1.0 候選</div></section><section id="quiz" class="c hide"><div class="quiz-actions"><button class="btn sec" onclick="backToStart()">← 返回測驗入口</button></div><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px"><button class="btn" onclick="toggleReview()">查看錯題</button><a class="btn sec" href="leader-training.html" style="text-decoration:none">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note">OWNER UAT 測試版：本次作答已記錄考試日期與成績歷史。</p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";
function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
let startedAt=null;
const Q=[["判斷力","安排當天工作前，下列哪一組最符合課程要求應先掌握的內容？",["人員、成本、設備、出勤與獎金","工單、品質、客戶、績效與出貨","工作、人員、設備、材料與優先順序","設備、材料、教育、薪資與改善紀錄"],2],["調度力","現場有2名熟手、1名一般人員及1名新人，同時有高難度、穩定量產及低風險工作。哪種配置較合理？",["熟手做關鍵工作，一般人員量產，新人做低風險工作","熟手全部投入穩定量產，新人直接負責高難度工作累積經驗","四個人平均分配三類工作，讓每個人的工作量接近","熟手包辦重要工作，新人先等待有空的工作再加入"],0],["判斷力","目前有三項工作：A今天下午交貨但仍有時間；B明天交貨，但下一站4人正在等料；C是急單，但材料尚未到。B目前人員、材料、設備都已具備。哪一項較適合優先處理？",["A，因為今天交貨應優先於明天交貨","C，因為掛急單後應維持最高順位","A與B平均分配人力，同時向前推進","B，因為目前能做，而且不做會立即影響下一站"],3],["應變力","哪一句最符合本堂所說的「進度掌握」？",["工作有開始做，就代表進度正在正常推進","工作過程要持續看完成量、卡點及支援需求","每天下班前統一確認一次，就足以掌握進度","主要確認最後有沒有完成，不必一直干預過程"],1],["判斷力","現在14點：A今天17點交貨，再2小時可以完成；B明天交貨，但瓶頸製程即將空下來，若現在不接續，後段會等待；A、B目前都具備生產條件。哪種安排較合理？",["先完成A，今天交貨的工作優先最容易掌握","A與B各分一半人力，讓兩邊保持同步進行","先讓B銜接瓶頸，再確認A仍能在交期前完成","先維持原排程，除非主管要求才能變更順序"],2],["管理力","本堂課所說的「有效工時」，較接近下列哪一項？",["總工時扣除損耗工時後，實際可投入作業的時間","從上班到下班的全部時間，不扣除準備及等待","只有設備真正運轉時，才可以計入有效工時","只有產出良品的時間，其他作業時間都不計算"],0],["調度力","負責關鍵工作的熟手臨時請假，而今天的安排原本是依他的能力配置。哪種處理最不適合？",["重新確認其他人可以獨立完成哪些工作","重新判斷哪些工作延誤會先影響整體","調整部分工作順序，必要時安排支援","先照原分工做到下午，再處理人力缺口"],3],["應變力","今日計畫100件，中午完成45件。幹部接下來較合理的做法是？",["先要求現場加快，下午再確認有沒有追上","比較計畫與實際，再確認剩餘量、卡點及是否需調整","先記錄完成45件，其他資料下班前再統一整理","先維持原安排，避免太早介入影響現場作業節奏"],1],["判斷力","主管交代「今天急單優先」。現場同時有三張急單：一張缺料、一張不做會讓後段等待、一張交期最近。幹部應怎麼處理？",["先做交期最近的一張，其餘等完成後再安排","三張平均配置人力，避免任何一張完全停止","比較能不能做、後段影響與交期，再排急單內部順序","依急單進廠時間排序，先來的就應該先做"],2],["調度力","急單需要甲設備，但甲設備突然故障；另一張一般單可使用乙設備立即生產。較合理的安排是？",["保留急單原有人力待命，避免設備修復後再集合","先把乙設備也留給急單，避免一般單占用資源","先全力完成一般單，設備修復後再處理急單","先推進目前可做的工作，同時處理甲設備問題"],3],["管理力","主管要判斷「現在是否需要調整現場安排」。哪一組資訊最有幫助？",["計畫與實際進度、主要卡點、資源狀況及後段影響","今日產量、昨日產量、出勤人數及設備使用次數","工單總數、人員工作內容及現場目前忙碌程度","工作開始時間、完工數量、現場人數及明日預估量"],0],["判斷力","現在9點，兩組人力最多同時推進兩項工作：A今天16點交貨，尚需3小時；B明天交貨，但40分鐘後下一站會斷料；C是超急單，主要材料12點才到，目前可先做30分鐘前置準備。哪種安排較合理？",["先推A與C，因今天交期與超急單應同時保住","先推B與C，因後段等待與超急單最具急迫性","先推A與B，C完成必要前置後待材料到貨再重新安排","三項工作輪流投入人力，避免任何一張單長時間停住"],2],["應變力","某工作目前仍符合原計畫，但依現在速度推估，一小時後會造成下一站等待。幹部較合理的做法是？",["尚未正式落後，可維持原安排直到產生實際偏差","先確認變慢原因與可能影響，必要時提前調整","讓下一站先自行調整工作，本站先維持目前速度","等下次固定確認時間，再依實際差距決定是否處理"],1],["調度力","某工單100件，製程允許分批生產及分批流到下一站。目前50件材料已到，後續50件下午確定到貨，而且下一站正在等料。較合理的安排是？",["等100件材料全到後一起做，減少中途切換","先把人力轉去其他工單，下午再一次完成","維持設備空閒，避免其他工作占用生產條件","先做已具備條件的50件，材料到貨後再接續"],3],["判斷力","上午10點：A是急單，但材料14點才會到；B明天交貨，目前條件齊全，若30分鐘內不進瓶頸製程，下一站4人會等待；C今天17點交貨，條件齊全，剩餘作業約1小時。較合理的安排是？",["先等A材料到位，急單必須維持第一順位","先完成C，因今天交貨必須優先於明天","先讓B通過瓶頸，再做C；A材料到後重新評估","三張各安排部分人力，讓所有工作同時向前"],2],["管理力","甲、乙兩天的有效產出都是97件。甲日：總工時24小時、損耗1.5小時、無效1件；乙日：總工時24小時、損耗4小時、無效5件。哪項判斷較合理？",["不能只看97件，還要比較損耗工時與無效數量","兩天有效產出相同，所以生產表現可以視為相同","兩天總工時相同，所以資源使用效率也是相同","乙日仍產97件，代表較高損耗沒有造成實際影響"],0],["應變力","中午同時出現：A進度稍慢但仍有時間餘裕；B目前進度正常；C瓶頸設備異常，多項後續工作都需要經過；D明天才交貨。哪一項最值得優先處理？",["A，因為已出現落後跡象","C，因瓶頸異常可能擴大成整體進度問題","B，確保目前正常的工作不被其他問題打亂","D，提早完成可以降低明天的交期壓力"],1],["調度力","現場只有一位能獨立操作瓶頸設備的熟手。A是急單，但後續仍有6小時餘裕；B是一般單，但後段3人正在等待瓶頸設備產出；新人只能做前置作業；一般人員可完成A的部分工作。哪種配置較合理？",["熟手先做A，急單應優先使用能力最好的人","熟手在A、B之間切換，讓兩邊都維持進度","熟手守瓶頸B，一般人員推進A，新人做低風險前置","熟手先教新人操作瓶頸設備，再自己轉去做A"],2],["管理力","下班前要讓隔日接手的人能順利繼續工作。哪一組交接資訊最有價值？",["今日出勤、總產量、加班人員及各人工作內容","今日急單、設備數量、完成數量及現場忙碌程度","今日良品數、工單數量、現場人數及明日預估量","未完成項目、目前進度、卡點狀況及隔日接續事項"],3],["判斷力","上午原計畫：A工單中午完成，目前已達100%；B工單下午完成，目前略超前；C工單進度正常，使用全廠唯一瓶頸設備。此時新增今天要交的D急單，也需要瓶頸設備。D現在不開始仍能準時，但再延後2小時就有交期風險。較合理的處理是？",["確認C剩餘瓶頸時間與D最晚投入點，再安排設備切換","D既然是急單，立即中斷C並把設備轉給D","C目前正常，維持原排程做完後再安排D","先抽B的人力支援D，瓶頸設備暫時不需要調整"],0],["應變力","依第二堂內容，下班前的進度確認最應包含哪一項？",["當日產量、出勤人數及每人的實際工作時間","完成狀況、未完成原因及隔日需要接續的事項","每位人員今天被安排過哪些工作及設備項目","今日設備報修次數及所有故障的完整處理紀錄"],1],["調度力","甲製程進度落後，幹部打算從乙製程抽2人支援。但甲真正卡點是設備速度，加人無法提高設備產量；乙少人後，1小時內會影響下一站供料。較合理的做法是？",["維持目前人力，先處理真正限制甲製程的設備問題","從乙抽1人支援甲，折衷降低兩邊受到的影響","仍抽2人支援甲，至少能表示已開始採取改善","將甲的工作拆成更多部分，讓更多人一起分擔"],0],["管理力","設備異常已影響某張工單。本堂課要求幹部掌握現場資訊，哪一組最應納入？",["設備型號、購買日期、操作人員及最近保養時間","工單編號、客戶名稱、交期及設備品牌資料","員工姓名、今日出勤、工作心得及設備使用次數","工單進度、設備狀態、造成影響及目前支援需求"],3],["應變力","三個工作站今日個別進度全部達成100%，但是第二站前累積大量半成品，第三站下午曾停等40分鐘。哪個判斷較合理？",["三站都達成100%，整體進度管理結果可以視為正常","仍需檢查站與站之間的流動，個別達標不代表整體順暢","第二站前堆料屬於正常緩衝，只要最後有完成即可","第三站只停等40分鐘，尚不足以判定安排存在問題"],1],["管理力","兩個工作日的紀錄如下：甲日計畫100件、有效產出98件、無效2件、損耗1小時，設備問題已排除；乙日計畫90件、有效產出90件、無效0件、損耗4小時，其中3小時為待料，下一批材料到貨時間仍未確認。如果幹部要判斷「明天最需要先追哪個風險」，哪個較合理？",["先追甲日，因為98件沒有完成原定100件","兩天都接近或達成計畫，因此暫時不用特別追蹤","先追乙日材料問題，今天雖達標，但明天仍可能再次待料","先追甲日2件無效數量，因為數量異常比待料更重要"],2]];window.QUESTION_BANK=Q;let cur=0,ans=Array(Q.length).fill(null);
function startQuiz(){startedAt=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}
function backToStart(){if(!confirm('確定要返回測驗入口嗎？目前已作答的內容將清除。'))return;cur=0;ans=Array(Q.length).fill(null);startedAt=null;quiz.classList.add('hide');start.classList.remove('hide')}
function render(){pt.textContent=(cur+1)+' / '+Q.length+' 題';at.textContent='已作答 '+ans.filter(x=>x!==null).length+' 題';pb.style.width=((cur+1)/Q.length*100)+'%';qn.textContent='QUESTION '+String(cur+1).padStart(2,'0');qt.textContent=Q[cur][1];choices.innerHTML='';Q[cur][2].forEach((x,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent='ABCD'[i]+'. '+x;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}
function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}
function prevQ(){if(cur>0){cur--;render()}}
function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}
function band(s){return s>=90?'觀念掌握良好':s>=80?'具備基本幹部觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),s=Math.round(correct/Q.length*100),domains=domainScores(),date=localDate();quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code.value.trim()||'匿名')+'｜'+date;score.textContent=s+' 分';document.getElementById('band').textContent=band(s);document.getElementById('correct').textContent='答對 '+correct+'/'+Q.length;const items=Object.entries(domains).sort((a,b)=>a[1]-b[1]);weak.innerHTML='<h3>四大能力面向</h3>'+items.map(([k,v])=>'<span class="pill">'+k+' '+v+'%</span>').join('');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+='<div style="padding:14px 0;border-top:1px solid var(--l)"><b>'+(i+1)+'. '+q[1]+'</b><div class="err">你的答案：'+'ABCD'[ans[i]]+'. '+q[2][ans[i]]+'</div><div class="ok">正確答案：'+'ABCD'[q[3]]+'. '+q[2][q[3]]+'</div></div>'});try{const payload={course:'第二堂｜工作安排與進度掌握',courseId:'C02',code:code.value.trim(),email:email.value.trim(),publicOpt:false,date,score:s,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await resp.json();if(!d.ok)throw new Error(d.error||'寫入失敗')}catch(e){alert('本次成績日期未能寫入後台，請告知管理者。')}}
function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
