</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>總會考｜1～8堂綜合測驗</h1><div class="sub">現場幹部培訓｜總會考</div></div><div class="badge">50題｜滿分100分</div></div><p>本測驗共50題單選題，每題2分，滿分100分；目前題庫已備妥，正式開放前暫不提供作答。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><div style="margin-top:18px"><button class="btn" disabled style="opacity:.55;cursor:not-allowed">未開放</button></div><p class="note">總會考目前尚未開放；正式開放後考試日期由系統自動記錄。</p><div class="note" style="margin-top:18px;text-align:right">總會考｜50題候選 V1.0</div></section><section id="quiz" class="c hide"><div class="quiz-actions"><button class="btn sec" onclick="backToStart()">← 返回測驗入口</button></div><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px"><button class="btn" onclick="toggleReview()">查看錯題</button><a class="btn sec" href="leader-training.html" style="text-decoration:none">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note">本次作答已記錄考試日期與成績歷史。</p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";
function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
let startedAt=null;
const EXAM_OPEN=false;
const Q=[["第7堂","設備的防護剛剛鬆掉，熟手把它推回原位後說：「現在看起來好了，可以繼續。」你會怎麼處理？",["先停下、隔離、確認安全再做","先提醒小心，做完後再檢查","先隔離現場，其他工作照常","先換熟手操作，再確認狀況"],0],["第2堂","目前有三項工作：A今天下午交貨但仍有時間；B明天交貨，但下一站4人正在等料；C是急單，但材料尚未到。B目前人員、材料、設備都已具備。哪一項較適合優先處理？",["A與B平均分配人力，同時向前推進","B，因為目前能做，而且不做會立即影響下一站","A，因為今天交貨應優先於明天交貨","C，因為掛急單後應維持最高順位"],1],["第1堂","某組連續幾天最後都有完成工作，但每天過程中都曾出現明顯延遲。組長認為：「最後都有完成，所以問題不大。」這個觀念主要缺少什麼？",["要求作業員提高速度的能力","親自下場支援工作的意願","對工作過程與現場狀況的掌握","增加現場人力的積極程度"],2],["第3堂","下列哪一項最不符合「不製造不良」的做法？",["作業開始前確認圖面內容與材料規格","生產過程依照正確作業條件進行操作","發現異常時先確認原因及可能影響範圍","明知設備異常仍繼續生產"],3],["第4堂","產品方向做反了，幹部想真的找出原因。下面哪一句比較適合先問？",["「從哪一個步驟開始不一樣？」","「這次第一個做錯的人到底是誰？」","「是不是因為操作還不夠熟？」","「工令是不是哪裡沒有看清楚？」"],0],["第1堂","一名資深技術員升任組長後，自己的工作仍能穩定完成，但組員常不知道工作先後順序，也常因彼此等待而影響進度。他目前最需要補強哪一項能力？",["提高處理困難工作的效率","掌握人員、進度與團隊結果","增加各項設備的操作能力","在工作落後時主動協助"],1],["第1堂","「會帶」與「會管」的主要差別較接近哪一項？",["會帶需要技術，會管不需要技術","會帶主要管人，會管主要管設備","會帶重在教人，會管還要掌握整體","會帶負責新人，會管負責資深人員"],2],["第7堂","這堂課講的5S，最重要不是漂亮，而是要做到什麼？",["讓主管不用一直到現場查看","讓所有區域都照同一種擺法","讓現場看起來整齊又乾淨","讓正常和異常更容易被看見"],3],["第2堂","主管交代「今天急單優先」。現場同時有三張急單：一張缺料、一張不做會讓後段等待、一張交期最近。幹部應怎麼處理？",["比較能不能做、後段影響與交期，再排急單內部順序","依急單進廠時間排序，先來的就應該先做","先做交期最近的一張，其餘等完成後再安排","三張平均配置人力，避免任何一張完全停止"],0],["第6堂","一名新人連續兩次將完工品放錯待製區，已影響下一站取件。下列哪一種處理方式不符合「對事不對人與場合分寸」的做法？",["私下請新人說明判斷過程，再確認是否需要重新帶教","在組內會議中說明當事人的判斷過程，請大家共同討論改善","檢查工令與區域標示是否清楚，降低再次放錯的機會","在組內會議中重申待製區規則，並說明放錯可能造成的影響"],1],["第1堂","幹部每天除了工作進度，還需要注意人員、品質、安全、異常與現場。主要代表什麼？",["幹部要親自處理所有現場問題","幹部要取代其他單位進行管理","幹部需要持續掌握整體現場","幹部需要填寫更多管理表單"],2],["第1堂","兩位資深員工進行同一項工作，使用不同方式，但品質都符合要求。公司準備讓新人開始學習這項工作。組長較適當的作法是？",["讓新人自行選擇習慣的方式","採用年資較久人員的方式","優先採用目前較快的方式","比較兩種方式後確認共同作法"],3],["第7堂","平常規定工具一定要定位，但一趕貨就可以隨便放。久了現場最可能變成什麼？",["大家會覺得忙的時候規定能省","隔天整理回去就不會有影響","熟手能適應，新人比較難跟上","大家會更懂得配合現場彈性"],0],["第2堂","某工作目前仍符合原計畫，但依現在速度推估，一小時後會造成下一站等待。幹部較合理的做法是？",["尚未正式落後，可維持原安排直到產生實際偏差","先確認變慢原因與可能影響，必要時提前調整","讓下一站先自行調整工作，本站先維持目前速度","等下次固定確認時間，再依實際差距決定是否處理"],1],["第5堂","新人跟著熟手做了幾天，速度已經跟得上。他說：「我會了，可以自己做。」幹部怎麼確認比較合適？",["問熟手他這幾天表現如何，熟手說沒問題，就讓他自己做","看他做完的數量是否達標，數量跟得上，就讓他自己接著做","請他自己做一件，觀察關鍵步驟，再請他指出要檢查的地方","請他把操作順序完整說一次，說得出來，就安排他獨立作業"],2],["第2堂","現在14點：A今天17點交貨，再2小時可以完成；B明天交貨，但瓶頸製程即將空下來，若現在不接續，後段會等待；A、B目前都具備生產條件。哪種安排較合理？",["先維持原排程，除非主管要求才能變更順序","先完成A，今天交貨的工作優先最容易掌握","A與B各分一半人力，讓兩邊保持同步進行","先讓B銜接瓶頸，再確認A仍能在交期前完成"],3],["第6堂","主管下午還要安排人力，現在詢問這批工作的進度。哪一種回報最能讓他馬上判斷要不要調人支援？",["工令260715-02共10件，已完成6件，預計三點完成，暫時不用支援","工令260715-02已完成6件，剩下部分照目前速度今天應該做得完","這批總共10件，目前剩下4件，現場都在趕工，做完會馬上回報","目前整體進度大約六成，預計下午完成，需要支援時會再通知"],0],["第4堂","同一批產品發現一件外觀有問題，已經另外放開；接著檢查5件都正常，但原因還不知道。你接下來怎麼做比較合理？",["換熟手接手後照原本繼續","隔開異常件，確認後再決定續做","整批先停，等原因全部查清楚","先把整批做完再一起處理"],1],["第3堂","收到上一站送來的產品，發現外觀有明顯變形時，應該如何處理？",["由現場自行修整，再依照原定進度繼續作業","與其他良品共同放置，等待主管巡視時處理","暫停使用，先確認產品狀況","先投入生產，再觀察後續組裝是否會受影響"],2],["第5堂","新人連續三天都由熟手在旁提醒，做出的產品也都合格。幹部準備安排他下週自己做，下列哪一個選項的判斷正確？",["熟手最清楚新人的能力，只要熟手同意，就能安排他自己做","新人能完整說出步驟，就表示已經理解，可以安排他獨立作業","連續三天都合格，表示做法已經熟悉，可以安排他自己做","目前只能確認有人提醒時做得好，還要看少了提醒能不能完成"],3],["第3堂","產品準備交給下一站時，作業人員發現焊道外觀與平常不同，但無法自行判斷是否合格。此時最適合怎麼做？",["將產品區分放置，並請相關人員共同確認","只要焊道沒有明顯破裂，就可以正常移交","先自行補焊一次，再依補焊後的外觀決定","先交給下一站，請下一站使用時再協助判斷"],0],["第8堂","哪一組最接近有效紀錄應包含的內容？",["工單、設備、品名、主管","時間、對象、事實、數量、影響","人員、主管、部門、結果","日期、班別、職稱、簽名"],1],["第3堂","開始生產新工單前，為了避免做錯產品規格，應確認哪一組資料？",["下站空間、搬運工具以及預定交接人員","生產數量、完成時間以及預定交貨日期","工單、圖面、材料及設備條件","人員出勤、工作分配以及預定休息時間"],2],["第6堂","主管上午交代工令甲今天要完成，下午另一位主管又要求先做工令乙。兩張都說急，但現有人力做不完。幹部怎麼處理比較合適？",["請同仁兩張同時做、各完成一半，讓兩位主管都看得到工作有在推進","依自己的經驗先選一張趕完，另一張延後的原因，等下班回報時一起說明","先做下午才交代的工令乙，等工令甲的主管問起，再說明安排已改變","把兩張的進度、交期和人力說清楚，請兩位主管確認先後，再向同仁交代"],3],["第4堂","你發現一件產品尺寸好像不對，後面還有20件準備接著做。這時你會怎麼處理？",["後面的先別做，先確認尺寸","先把後面20件一起做完","熟手覺得可以就繼續做","先換一個人再做一件看看"],0],["第8堂","哪一句最符合「紀錄」與「管理資料」的關係？",["管理資料主要靠主管經驗判斷","紀錄累積後才能形成管理資料","數字合理就不必確認來源","有管理資料後就不用留原始紀錄"],1],["第4堂","熟手一直都會做這項工作，但這次規格改了；工單上雖然有更新，他還是照舊方法做錯。哪個改善比較值得先做？",["完工後再多查一次防止流出去","把這次錯誤公告給大家注意","開工前先講清楚這次哪裡不同","要求熟手每次自己記住規格變更"],2],["第3堂","銳角處理人員準備將產品交給下一個塗裝站時，發現部分邊角仍有毛刺。此時最適合怎麼做？",["將毛刺位置做記號，交由下一站決定是否處理","混入其他產品一起移交，最後再由品檢確認","先移交產品，再口頭提醒下一站注意毛刺","完成本工序應有的處理並確認後再移交"],3],["第5堂","新人第一次操作一項包含多個步驟的工作時，幹部採取哪一種帶教方式較合適？",["依作業環節分段帶教，完成一項、確認一項","先把全部步驟完整講完，再請新人自行反覆練習","由資深人員全程陪做，遇到錯誤時直接協助完成","先讓新人完成整項工作，再依最後結果統一說明"],0],["第8堂","哪一項最符合「改善不一定是大工程」？",["導入大型資訊系統","減少每天找工具的時間","全面更換工廠設備","重做整套管理制度"],1],["第3堂","準備加工時，材料外觀看起來正常，但材料標示的工單編號與手上的工單不同。此時最適合怎麼做？",["先加工首件，只要成品外觀正常就繼續生產","材料外觀正常即可先使用，之後再補確認編號","先區分放置，確認工單與材料規格是否相符","詢問附近同仁是否看過這批材料即可使用"],2],["第7堂","現場同時有三個狀況：今天要出的產品只差最後幾件；通道旁半成品很多，轉彎已經要特別閃；一台設備的安全防護有點鬆，但目前還能運轉。如果你是幹部，哪個處理最合理？",["先整理通道再讓熟手繼續操作","先把今天要出的產品做完再處理","先提醒大家注意通道和設備狀況","先處理會立即影響安全的狀況"],3],["第1堂","主管臨時問組長：「你們這一組現在整體狀況怎麼樣？」組長只知道自己的工作已完成，但還不清楚其他人的進度。較適當的作法是？",["先確認整組狀況再做說明","先回答自己的工作已經完成","請每位作業員各自向主管說明","等全部工作完成後再一起說明"],0],["第8堂","現場一直說「最近常缺料」，如果想知道是不是常態，第一步最適合做什麼？",["先增加所有材料庫存","記錄次數、時間與影響","先要求採購提出改善","直接列入人員考核"],1],["第5堂","新人在旁邊有人提醒時已經做得完，但自己做仍會漏掉檢查步驟。這時幹部怎麼做比較合適？",["每個步驟都繼續在旁提醒，確定不會錯了再放手","先請熟手幫他把工作完成，之後有空再讓他練習","少提醒一些讓他自己試，漏掉的步驟再帶他確認","直接整批交給他自己做，實際多做幾次自然就會熟"],2],["第5堂","幹部交代：「這兩件風管清洗好後，放到指定位置，再回報我。」同仁回了一聲「好」，就準備開始做。幹部想確認他有沒有聽清楚，接著怎麼問比較合適？",["「剛才講的都有聽懂吧？有不清楚的地方，記得先問我。」","「這兩件你以前洗過吧？這次一樣，照之前的方式處理。」","「要放哪裡應該知道吧？先開始做，我等一下再過來看。」","「你指一下洗好要放哪裡，再跟我說做完後還要做什麼。」"],3],["第8堂","哪一組資料最有機會形成可靠的管理資料？",["完成量、不良數、停機時間","最近很忙、品質變差","員工姓名、部門、年資","主管評語、工作態度"],0],["第8堂","現場使用表單最主要的目的為何？",["證明每天都有做紀錄","留下現場發生的事情","增加主管簽核的資料","統一所有部門的格式"],1],["第4堂","現場一出現異常，你最先要處理的是什麼？",["先把責任歸屬問清楚","先留下紀錄再繼續做","先把影響和風險控制住","先找出這次是誰做錯"],2],["第1堂","哪個順序最符合本堂課的幹部成長概念？",["會改善 → 會做 → 會帶 → 會管","會做 → 會管 → 會帶 → 會改善","會帶 → 會做 → 會管 → 會改善","會做 → 會帶 → 會管 → 會改善"],3],["第8堂","哪一條路徑最符合本堂最後的管理觀念？",["發生事情 → 留下紀錄 → 累積資料 → 看見問題","發生事情 → 主管判斷 → 找人處理 → 結案","建立表單 → 排名人員 → 找出表現差者","發現問題 → 設目標 → 找責任人 → 補紀錄"],0],["第7堂","A區每天整理得很整齊，但材料位置會依空間調整；B區看起來沒那麼漂亮，但每一類材料都有固定區域和標示。哪個判斷較合理？",["要看哪一區整理花的時間比較少","B區較容易發現放錯或拿錯","A區較好，因為每天整理整齊就算有做到5S","兩區都可以，只要員工找得到"],1],["第6堂","幹部請兩位同仁一起備料，兩人都以為數量會由對方確認，結果材料備好了，卻沒人清點。下次交代類似工作時，怎麼說比較合適？",["「這批你們一起負責，誰先做完，誰就順便確認數量再回報。」","「照上次的分工備料，這次記得多注意數量，完成後再通知我。」","「阿明負責備料，阿成核對規格和數量，確認好後由阿成回報。」","「你們兩個一起備料，做好後互相看一下，沒問題就送過去。」"],2],["第6堂","現場同仁對公司新規定感到不滿，幹部也發現執行上有困難。下列哪一種做法不適合？",["先聽完同仁的不滿，不急著反駁，再把話題帶回實際問題","先說明意見會往上反映，但目前工作仍依現行規定執行","私下關心情緒較大的同仁，等他冷靜後再了解困難原因","把不滿的同仁集中在一起，共同討論規定不合理的地方"],3],["第2堂","中午同時出現：A進度稍慢但仍有時間餘裕；B目前進度正常；C瓶頸設備異常，多項後續工作都需要經過；D明天才交貨。哪一項最值得優先處理？",["C，因瓶頸異常可能擴大成整體進度問題","B，確保目前正常的工作不被其他問題打亂","D，提早完成可以降低明天的交期壓力","A，因為已出現落後跡象"],0],["第4堂","新人今天做得比熟手慢，但產品都有做對。你現在就說他「太慢」，還少看了什麼？",["新人本來就不能跟熟手比較","他現在應該做到什麼程度","只要東西做對速度就不用管","全組今天平均做了多少數量"],1],["第6堂","生管一次拿一疊工令交給現場幹部。幹部確認好先後順序後，接下來怎麼交代比較合適？",["先口頭交代最急的工令，其餘放在旁邊之後再說","把整疊工令交給熟手，由他看現場情況自行安排","依確認的順序逐張分派，說清楚誰做、何時完成","把工令放在工作區，讓有空的人員自行拿取處理"],2],["第5堂","資深同仁接到一張與平常產品相似，但板厚和法蘭方向不同的工令。他看了一眼說：「這個我做過。」幹部怎麼做比較合適？",["把新版工令和圖面交給他，讓他自己找出全部差異","先讓他照平常方式做第一件，完成後再一起核對規格","從第一個步驟重新完整講一次，避免他受過去經驗影響","提醒這次不同的地方，請他指出重點後再開始"],3],["第7堂","工具區固定應有10支工具。早上只看到9支，但昨天有人把一支送修，白板沒有留下紀錄。這件事最值得改善的是什麼？",["工具放哪、少幾支、去了哪都要看得出來","少一支時先請全組一起找回來","每天下班前把工具重新排整齊","工具借出時固定由一個人保管"],0],["第2堂","設備異常已影響某張工單。本堂課要求幹部掌握現場資訊，哪一組最應納入？",["員工姓名、今日出勤、工作心得及設備使用次數","工單進度、設備狀態、造成影響及目前支援需求","設備型號、購買日期、操作人員及最近保養時間","工單編號、客戶名稱、交期及設備品牌資料"],1]];;let cur=0,ans=Array(Q.length).fill(null);
function startQuiz(){if(!EXAM_OPEN){alert('總會考目前未開放');return}startedAt=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}
function backToStart(){if(!confirm('確定要返回測驗入口嗎？目前已作答的內容將清除。'))return;cur=0;ans=Array(Q.length).fill(null);startedAt=null;quiz.classList.add('hide');start.classList.remove('hide')}
function render(){pt.textContent=(cur+1)+' / '+Q.length+' 題';at.textContent='已作答 '+ans.filter(x=>x!==null).length+' 題';pb.style.width=((cur+1)/Q.length*100)+'%';qn.textContent='QUESTION '+String(cur+1).padStart(2,'0');qt.textContent=Q[cur][1];choices.innerHTML='';Q[cur][2].forEach((x,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent='ABCD'[i]+'. '+x;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}
function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}
function prevQ(){if(cur>0){cur--;render()}}
function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}
function band(s){return s>=90?'觀念掌握良好':s>=80?'具備基本幹部觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),s=Math.round(correct/Q.length*100),domains=domainScores(),date=localDate();quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code.value.trim()||'匿名')+'｜'+date;score.textContent=s+' 分';document.getElementById('band').textContent=band(s);document.getElementById('correct').textContent='答對 '+correct+'/'+Q.length;const items=Object.entries(domains).sort((a,b)=>a[1]-b[1]);weak.innerHTML='<h3>八堂課表現</h3>'+items.map(([k,v])=>'<span class="pill">'+k+' '+v+'%</span>').join('');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+='<div style="padding:14px 0;border-top:1px solid var(--l)"><b>'+(i+1)+'. '+q[1]+'</b><div class="err">你的答案：'+'ABCD'[ans[i]]+'. '+q[2][ans[i]]+'</div><div class="ok">正確答案：'+'ABCD'[q[3]]+'. '+q[2][q[3]]+'</div></div>'});try{const payload={course:'總會考｜1～8堂綜合測驗',courseId:'CFINAL',code:code.value.trim(),email:email.value.trim(),publicOpt:false,date,score:s,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await resp.json();if(!d.ok)throw new Error(d.error||'寫入失敗')}catch(e){alert('本次成績日期未能寫入後台，請告知管理者。')}}
function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
