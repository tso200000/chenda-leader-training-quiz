<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜第4、7堂課後測驗</title><style>
:root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:18px}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:18px}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:28px}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:34px}h2{font-size:28px;line-height:1.45}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-size:18px;font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px 20px;margin:12px 0;font-size:22px;line-height:1.5;cursor:pointer}.choice.sel{border:2px solid var(--n);background:#edf4fb}.quiz-actions{display:flex;justify-content:flex-end;margin-bottom:14px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}.choice{font-size:21px;padding:17px 16px}.w{padding:12px 10px}.c{padding:18px 14px}.result-actions{flex-direction:column}}
</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>異常處理、紀律5S與安全管理</h1><div class="sub">第4、7堂｜合併課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗以異常判斷、風險處置、原因判斷、5S定位與安全紀律情境為主。完成後會立即顯示成績、能力面向與錯題檢討。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">考試日期由系統自動記錄；Email 留空仍可作答。</p></section><section id="quiz" class="c hide"><div class="quiz-actions"><button class="btn sec" onclick="backToStart()">← 返回測驗入口</button></div><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div class="result-actions"><button class="btn" onclick="toggleReview()">查看錯題</button><a class="btn sec" href="leaderboard.html?courseId=C04">公開成績</a><a class="btn sec" href="stats.html?courseId=C04">統計分析</a><a class="btn sec" href="leader-training.html">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note" id="cloud"></p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}let startedAt=null;
const Q=[["異常辨識","今天現場出現一個狀況，你要判斷它算不算異常，第一個要看什麼？",["是不是跟昨天完全一樣","大家有沒有覺得很麻煩","有沒有偏離原本的標準","有沒有影響今天的交期"],2],["異常辨識","今天你聽到設備聲音和平常不太一樣，但尺寸、產量目前都正常。你會先怎麼做？",["先拿平常正常的狀況來比較","先停機，直接當成設備故障","先繼續做，等產品異常再處理","先問熟手以前有沒有遇過"],0],["異常辨識","昨天做100件，今天只做90件；但今天原本排程是85件，而且產品也比昨天難做。有人說：「今天退步了。」你怎麼看？",["今天比昨天少10件就算異常","今天超過排程85件就一定正常","今天交期沒延誤就不用再追","先照今天目標和工作條件來看"],3],["異常辨識","新人今天做得比熟手慢，但產品都有做對。你現在就說他「太慢」，還少看了什麼？",["新人本來就不能跟熟手比較","他現在應該做到什麼程度","只要東西做對速度就不用管","全組今天平均做了多少數量"],1],["異常辨識","今天這張工單少了一個重要資訊，材料看起來跟以前一樣，熟手也說：「這個我做過，照以前做就好。」你怎麼處理？",["照以前做法先把這批做完","先換別張工單避免現場卡住","先把這次缺的資訊確認清楚","先做一件看看結果再決定"],2],["風險處置","現場一出現異常，你最先要處理的是什麼？",["先把影響和風險控制住","先找出這次是誰做錯","先把責任歸屬問清楚","先留下紀錄再繼續做"],0],["風險處置","你發現一件產品尺寸好像不對，後面還有20件準備接著做。這時你會怎麼處理？",["先把後面20件一起做完","熟手覺得可以就繼續做","先換一個人再做一件看看","後面的先別做，先確認尺寸"],3],["風險處置","現場同時發生三件事：急單已經比原定進度慢一點；一件產品外觀有問題，但已經另外放開；一台設備的安全防護有問題，有人準備使用。你會先處理哪一件？",["先追急單，避免交期繼續落後","先處理安全防護有問題的設備","先確認外觀異常會不會再出現","三件事平均分人一起處理"],1],["風險處置","現場出了狀況，你在想：「到底要不要停？」這時最該先看哪幾件事？",["誰在做、做多久、做多少","客戶交期、工單、主管要求","嚴重程度、影響、擴大、安全","產量、人數、設備、剩餘工時"],2],["風險處置","同一批產品發現一件外觀有問題，已經另外放開；接著檢查5件都正常，但原因還不知道。你接下來怎麼做比較合理？",["隔開異常件，確認後再決定續做","整批先停，等原因全部查清楚","先把整批做完再一起處理","換熟手接手後照原本繼續"],0],["原因判斷","昨天才處理好的問題，今天又再發生一次。這時你最該做什麼？",["多加一道檢查避免流出去","再提醒大家照規定操作","先找第一次做錯的人說明","查為什麼同樣問題一直發生"],3],["原因判斷","產品方向做反了，幹部想真的找出原因。下面哪一句比較適合先問？",["「工令是不是哪裡沒有看清楚？」","「從哪一個步驟開始不一樣？」","「這次第一個做錯的人到底是誰？」","「是不是因為操作還不夠熟？」"],1],["原因判斷","同一台設備這星期卡住三次，三次都是不同人操作，每次清一下又可以繼續。今天又卡一次。你下一步最值得做什麼？",["換另一個熟手操作一段時間看看","再清一次，先把今天的工作做完","比較三次發生前有什麼共同點","增加巡查次數看能不能提早發現"],2],["原因判斷","同一個工作換了好幾個人做，大家都容易錯在同一個地方。你會先查什麼？",["那一步是不是特別容易看錯或搞錯","大家最近是不是工作比較不用心","最近是不是加班太多、休息太少","改成只讓最熟的人一直做"],0],["原因判斷","熟手一直都會做這項工作，但這次規格改了；工單上雖然有更新，他還是照舊方法做錯。哪個改善比較值得先做？",["要求熟手每次自己記住規格變更","完工後再多查一次防止流出去","把這次錯誤公告給大家注意","開工前先講清楚這次哪裡不同"],3],["5S與定位","這堂課講的5S，最重要不是漂亮，而是要做到什麼？",["讓現場看起來整齊又乾淨","讓正常和異常更容易被看見","讓主管不用一直到現場查看","讓所有區域都照同一種擺法"],1],["5S與定位","工具區固定應有10支工具。早上只看到9支，但昨天有人把一支送修，白板沒有留下紀錄。這件事最值得改善的是什麼？",["每天下班前把工具重新排整齊","工具借出時固定由一個人保管","工具放哪、少幾支、去了哪都要看得出來","少一支時先請全組一起找回來"],2],["5S與定位","A區工具都有固定位置，但交班時不會點數；B區每天都有點數，但工具沒有固定位置。如果要讓異常更容易被發現，你覺得哪種改善比較完整？",["固定位置，同時保留交班點數","只要交班點數，不必固定位置","只要固定位置，不必再做點數","改由熟手保管，其他人再借用"],0],["5S與定位","A區每天整理得很整齊，但材料位置會依空間調整；B區看起來沒那麼漂亮，但每一類材料都有固定區域和標示。哪個判斷較合理？",["A區較好，因為每天整理整齊就算有做到5S","兩區都可以，只要員工找得到","要看哪一區整理花的時間比較少","B區較容易發現放錯或拿錯"],3],["5S與定位","現場空間有限，良品跟「還要再確認」的產品只能放在同一個大區域。怎麼做比較合理？",["放同一區，用白板寫清楚就好","同區也要分車分標示，不靠記憶","先由熟手記住，交班再說明","等空間有了再正式分開管理"],1],["安全與紀律","安全管理不能只一直叫大家「小心」，還要把哪些事情顧好？",["每個人的速度和工作產量","主管每天到現場查看次數","危險位置、防護和正確做法","今天交期和工單完成比例"],2],["安全與紀律","現場已經貼了「小心夾傷」，但那個位置還是真的可能夾到人。你會先做什麼？",["先把可能夾傷人的地方處理","再多貼幾張警告提醒大家注意","請大家簽名表示已經知道風險","先只讓熟手操作其他人別靠近"],0],["安全與紀律","設備的防護剛剛鬆掉，熟手把它推回原位後說：「現在看起來好了，可以繼續。」你會怎麼處理？",["先提醒小心，做完後再檢查","先隔離現場，其他工作照常","先換熟手操作，再確認狀況","先停下、隔離、確認安全再做"],3],["安全與紀律","平常規定工具一定要定位，但一趕貨就可以隨便放。久了現場最可能變成什麼？",["大家會更懂得配合現場彈性","大家會覺得忙的時候規定能省","隔天整理回去就不會有影響","熟手能適應，新人比較難跟上"],1],["安全與紀律","現場同時有三個狀況：今天要出的產品只差最後幾件；通道旁半成品很多，轉彎已經要特別閃；一台設備的安全防護有點鬆，但目前還能運轉。如果你是幹部，哪個處理最合理？",["先把今天要出的產品做完再處理","先提醒大家注意通道和設備狀況","先處理會立即影響安全的狀況","先整理通道再讓熟手繼續操作"],2]];window.QUESTION_BANK=Q;let cur=0,ans=Array(Q.length).fill(null);
function startQuiz(){startedAt=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}function backToStart(){if(!confirm('確定要返回測驗入口嗎？目前已作答的內容將清除。'))return;cur=0;ans=Array(Q.length).fill(null);startedAt=null;quiz.classList.add('hide');start.classList.remove('hide')}function render(){pt.textContent=(cur+1)+' / '+Q.length+' 題';at.textContent='已作答 '+ans.filter(x=>x!==null).length+' 題';pb.style.width=((cur+1)/Q.length*100)+'%';qn.textContent='QUESTION '+String(cur+1).padStart(2,'0');qt.textContent=Q[cur][1];choices.innerHTML='';Q[cur][2].forEach((x,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent='ABCD'[i]+'. '+x;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}function prevQ(){if(cur>0){cur--;render()}}function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}function band(s){return s>=90?'異常處理與現場管理觀念掌握良好':s>=80?'具備基本現場管理判斷':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),s=Math.round(correct/Q.length*100),domains=domainScores(),date=localDate();quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code.value.trim()||'匿名')+'｜'+date;score.textContent=s+' 分';document.getElementById('band').textContent=band(s);document.getElementById('correct').textContent='答對 '+correct+'/'+Q.length;weak.innerHTML='<h3>異常處理與現場管理面向</h3>'+Object.entries(domains).sort((a,b)=>a[1]-b[1]).map(([k,v])=>'<span class="pill">'+k+' '+v+'%</span>').join('');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+='<div style="padding:14px 0;border-top:1px solid var(--l)"><b>'+(i+1)+'. '+q[1]+'</b><div class="err">你的答案：'+'ABCD'[ans[i]]+'. '+q[2][ans[i]]+'</div><div class="ok">正確答案：'+'ABCD'[q[3]]+'. '+q[2][q[3]]+'</div></div>'});try{const payload={course:'第4、7堂｜異常處理、紀律5S與安全管理',courseId:'C04',code:code.value.trim(),email:email.value.trim(),publicOpt:false,date,score:s,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await resp.json();if(!d.ok)throw new Error(d.error||'寫入失敗');cloud.textContent='成績已成功記錄。'}catch(e){cloud.textContent='本次成績未能寫入後台，請告知管理者。'}}function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
