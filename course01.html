<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜現場幹部課後測驗</title><style> :root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:clamp(16px,1.2vw,18px)}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:clamp(16px,2.2vw,24px) clamp(12px,2vw,18px)}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:clamp(18px,3vw,28px)}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:clamp(28px,3vw,34px)}h2{font-size:clamp(24px,2.5vw,30px);line-height:1.45}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:clamp(16px,1.2vw,18px)}.btn{border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-size:clamp(17px,1.3vw,19px);font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:14px;padding:clamp(16px,1.8vw,20px) clamp(16px,2vw,22px);margin:12px 0;font-size:clamp(20px,1.7vw,24px);line-height:1.5;min-height:60px;cursor:pointer}.choice.sel{border:2px solid var(--n);background:#edf4fb}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.result-actions .btn{display:inline-block;margin:0}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){body{font-size:17px}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%;min-height:54px}.result-actions{flex-direction:column}.result-actions .btn{width:100%;display:block;margin:0}h1{font-size:28px}h2{font-size:clamp(23px,6vw,27px);line-height:1.5}.choice{font-size:clamp(20px,5vw,23px);padding:17px 16px;min-height:64px;margin:10px 0}.w{padding:12px 10px}.c{padding:18px 14px;border-radius:14px}}@media(max-width:420px){h1{font-size:26px}h2{font-size:22px}.choice{font-size:20px;line-height:1.55;padding:16px 14px}.badge{padding:9px 13px}.note{font-size:12px}}</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>現場幹部的角色與責任</h1><div class="sub">第一堂｜課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗以現場情境判斷為主。完成後會立即顯示成績與能力面向；若填寫 Email，系統會寄送個人成績通知。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><label><input id="pub" type="checkbox" style="width:auto"> 同意公開「代號／匿名＋分數＋日期」（Email 永不公開）</label><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">Email 留空仍可作答；有填寫才寄送成績。</p><div class="note" style="margin-top:18px;text-align:right">系統版本 V1.7｜更新日期 2026-09-10</div></section><section id="quiz" class="c hide"><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div class="result-actions"><button class="btn" onclick="toggleReview()">查看錯題</button> <a class="btn sec" href="leaderboard.html" style="text-decoration:none">公開成績</a> <a class="btn sec" href="stats.html" style="text-decoration:none">統計分析</a> <a class="btn sec" href="leader-training.html" style="text-decoration:none">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note" id="cloud"></p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";const Q=[["角色轉變","一名資深技術員升任組長後，自己的工作仍能穩定完成，但組員常不知道工作先後順序，也常因彼此等待而影響進度。他目前最需要補強哪一項能力？",["提高處理困難工作的效率","掌握人員、進度與團隊結果","增加各項設備的操作能力","在工作落後時主動協助"],1],["角色轉變","「資深技術員 → 儲備幹部 → 現場組長 → 現場主管」主要代表什麼？",["技術工作逐步交由他人負責","職位越高越少需要接觸現場","管理能力逐步取代技術能力","工作責任逐步由個人延伸到團隊"],3],["標準化管理觀念","兩位資深員工進行同一項工作，使用不同方式，但品質都符合要求。公司準備讓新人開始學習這項工作。組長較適當的作法是？",["採用年資較久人員的方式","優先採用目前較快的方式","比較兩種方式後確認共同作法","讓新人自行選擇習慣的方式"],2],["帶人責任觀念","哪一種情況最能表示一個人開始具備「會帶」的能力？",["能教導他人並確認對方理解","能穩定完成較困難的工作","能在新人做不完時協助完成","能在異常發生時自己處理"],0],["帶人責任觀念","今天有一項較急的工作。組員已有基本能力，在組長適度協助下仍有機會準時完成，而且未來仍需獨立負責相同工作。較適當的作法是？",["改由另一名熟手完成工作","由組長直接完成確保進度","全部交給組員自行完成","由組員操作，組長適度協助"],3],["帶人責任觀念","某組長技術很好。組員速度慢時，他常直接接手，所以每天工作通常都能完成。但一段時間後，組員仍很依賴他。最需要調整的是哪一項觀念？",["困難工作應固定交給熟手","幹部也要讓團隊逐步具備能力","每天工作完成才是主要責任","組長仍要維持自己的技術能力"],1],["帶人責任觀念","一項重要工作長期只有一名資深員工熟悉。只要他請假，其他人就很難獨立完成。組長較適當的作法是？",["整理關鍵作法並安排技能傳承","等工作較少時再安排其他人學習","維持現況以避免影響目前品質","每次臨時安排其他人協助即可"],0],["團隊結果責任","早上組長已完成工作分配。下午發現有人已做完、有人進度落後，另一個人正在等待下一項工作。組長認為：「早上都交代好了，每個人自己負責即可。」最大的問題是？",["每天都應重新分配所有工作","組長應直接幫落後的人完成","分配後仍要持續掌握團隊狀況","工作落後主要是作業員的責任"],2],["團隊結果責任","某組長認為：「人員和產量顧好就可以，品質最後還有人會檢查。」較適當的幹部觀念是？",["有人檢查時組長以產量為主","幹部仍要對團隊做出的品質負責","品質主要由最後檢查人員負責","發生客訴後再確認問題責任"],1],["標準化管理觀念","相同缺失一個月內發生數次，而且不同人員都曾發生。每次都已提醒「下次注意」。較適當的幹部觀念是？",["繼續提醒，人員自然會改善","找出最容易發生問題的人員","思考共同作法是否需要改善","最後有修好就不必再處理"],2],["整體現場觀","本組每天都能準時完成工作，但產品經常集中在接近下班時才送到下一製程，造成下一站前面等待、後面堆積。組長較適當的看法是？",["下一站應調整自己的人力安排","生管應負責處理兩站的銜接","本組準時完成就已經盡到責任","本組也要注意是否影響後續流程"],3],["帶人責任觀念","某組長技術很好，組員發生問題都直接找他處理。半年後，組員仍無法獨立判斷相同問題。最需要調整的是？",["將問題改交其他熟手處理","要求組員遇到問題立即回報","讓組員參與判斷與處理過程","提高組長處理問題的速度"],2],["整體現場觀","主管臨時問組長：「你們這一組現在整體狀況怎麼樣？」組長只知道自己的工作已完成，但還不清楚其他人的進度。較適當的作法是？",["先確認整組狀況再做說明","先回答自己的工作已經完成","請每位作業員各自向主管說明","等全部工作完成後再一起說明"],0],["標準化管理觀念","某項工作已有正式作業標準。一名熟手發現另一種方法更快，目前試做產品也符合要求。較適當的觀念是？",["品質正常就可以改用新方法","先依現行標準，再提出改善確認","熟手可改，新人維持原本方式","先使用新方法，有問題再恢復"],1],["帶人責任觀念","某組有一名資深員工能力很好，所以重要工作幾乎都固定交給他。短期工作很穩定，但其他人很少有機會承擔重要工作。最需要注意什麼？",["幹部也要逐步建立整體團隊能力","重要工作本來就應交給最好的人","員工能力差異應由自己改善","交期正常就不需要特別調整"],0],["團隊結果責任","工作數量已完成，交期也沒有問題，但組長沒有確認工作結果是否正確。主要問題是？",["作業員技術能力還不夠穩定","工作分配方式可能不夠平均","幹部只確認完成，沒有確認做對","組長參與現場工作的時間太少"],2],["幹部成長與錯誤觀念","「會帶」與「會管」的主要差別較接近哪一項？",["會帶負責新人，會管負責資深人員","會帶需要技術，會管不需要技術","會帶主要管人，會管主要管設備","會帶重在教人，會管還要掌握整體"],3],["整體現場觀","某組連續幾天最後都有完成工作，但每天過程中都曾出現明顯延遲。組長認為：「最後都有完成，所以問題不大。」這個觀念主要缺少什麼？",["要求作業員提高速度的能力","親自下場支援工作的意願","對工作過程與現場狀況的掌握","增加現場人力的積極程度"],2],["幹部成長與錯誤觀念","進度落後時，哪一個做法最接近「管理就是催、罵、要求」的錯誤觀念？",["只要求大家再做快一點","詢問目前工作卡在哪裡","確認現場是否需要協助","了解目前工作進行情況"],0],["標準化管理觀念","資深員工說：「這個工作做很多年了，大家都有經驗，不需要留下標準或紀錄。」較適當的觀念是？",["沒有異常就不需要特別留下資料","穩定經驗仍應逐步轉成共同標準","客戶要求時再開始建立相關資料","熟手不需要，新人再建立即可"],1],["團隊結果責任","每位組員都完成自己的工作，但下一製程因其中一批產品資訊不完整而等待。這最能反映什麼問題？",["組長參與現場作業時間不足","每個人的工作量分配不平均","組員本身工作速度不夠快","工作完成後仍未掌握整體結果"],3],["角色轉變","以下四名人員技術能力都很好。哪一位最接近成熟的現場幹部？",["能掌握人員與工作，並確認結果","異常發生時能最快親自處理","必要時會主動幫忙補足產量","工作分配完成後由人員自行負責"],0],["整體現場觀","幹部每天除了工作進度，還需要注意人員、品質、安全、異常與現場。主要代表什麼？",["幹部需要填寫更多管理表單","幹部要親自處理所有現場問題","幹部要取代其他單位進行管理","幹部需要持續掌握整體現場"],3],["幹部成長與錯誤觀念","哪個順序最符合本堂課的幹部成長概念？",["會做 → 會管 → 會帶 → 會改善","會帶 → 會做 → 會管 → 會改善","會做 → 會帶 → 會管 → 會改善","會改善 → 會做 → 會帶 → 會管"],2],["團隊結果責任","某新任組長認為：「工作有人做、品質有人檢、安全也有人負責，只要本組產量完成，我的責任就算完成。」較適當的幹部觀念是？",["重大問題發生後再由組長處理","組長仍要掌握團隊與整體結果","各項已有負責人，掌握產量即可","組長多接手重要工作會比較穩定"],1]];let cur=0,ans=Array(Q.length).fill(null),startedAt=null;
function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function startQuiz(){startedAt=new Date();document.getElementById('start').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render()}
function render(){const q=Q[cur];pt.textContent=`第 ${cur+1} / ${Q.length} 題`;at.textContent=`已作答 ${ans.filter(x=>x!==null).length} 題`;pb.style.width=`${(cur+1)/Q.length*100}%`;qn.textContent=`QUESTION ${String(cur+1).padStart(2,'0')}`;qt.textContent=q[1];choices.innerHTML='';q[2].forEach((c,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}
function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}function prevQ(){if(cur>0){cur--;render()}}
function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}
function band(s){return s>=90?'觀念掌握良好':s>=80?'具備基本幹部觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),score=Math.round(correct/Q.length*100),domains=domainScores(),code=document.getElementById('code').value.trim(),email=document.getElementById('email').value.trim(),pub=document.getElementById('pub').checked,date=localDate();const payload={course:'第一堂｜現場幹部的角色與責任',code,email,publicOpt:pub,date,score,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code||'匿名')+'｜'+date;document.getElementById('score').textContent=score+' 分';document.getElementById('band').textContent=band(score);document.getElementById('correct').textContent=`答對 ${correct}/${Q.length}`;
const vals=Object.values(domains);const min=Math.min(...vals);let title='',items=[];if(min>=90){title='各能力面向皆掌握良好';items=[]}else if(min>=80){title='可再精進的面向';items=Object.entries(domains).sort((a,b)=>a[1]-b[1]).slice(0,3)}else{title='較需要加強';items=Object.entries(domains).sort((a,b)=>a[1]-b[1]).filter(x=>x[1]<80).slice(0,3)};weak.innerHTML=`<h3>${title}</h3>`+(items.length?items.map(([k,v])=>`<span class="pill">${k} ${v}%</span>`).join(''):'<p class="ok">本次無明顯弱項，整體觀念掌握良好。</p>');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+=`<div style="padding:14px 0;border-top:1px solid var(--l)"><b>${i+1}. ${q[1]}</b><div class="err">你的答案：${'ABCD'[ans[i]]}. ${q[2][ans[i]]}</div><div class="ok">正確答案：${'ABCD'[q[3]]}. ${q[2][q[3]]}</div></div>`});try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await r.json();cloud.textContent=d.ok?'成績已送出雲端'+(email?'，Email 成績通知已寄送。':'。'):'雲端寫入失敗：'+(d.error||'未知錯誤')}catch(e){cloud.textContent='目前無法連線雲端，請稍後再試。'}}
function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
