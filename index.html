<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜現場幹部課後測驗</title><style>:root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:24px 18px}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:28px}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:32px}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px 16px;margin:10px 0;font-size:17px}.choice.sel{border:2px solid var(--n);background:#edf4fb}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}h1{font-size:26px}}</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>現場幹部的角色與責任</h1><div class="sub">第一堂｜課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗以現場情境判斷為主。完成後會立即顯示成績與能力弱項；若填寫 Email，系統會寄送個人成績通知。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><label><input id="pub" type="checkbox" style="width:auto"> 同意公開「代號／匿名＋分數＋日期」（Email 永不公開）</label><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">Email 留空仍可作答；有填寫才寄送成績。</p></section><section id="quiz" class="c hide"><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div style="margin-top:18px"><button class="btn" onclick="toggleReview()">查看錯題</button> <a class="btn sec" href="leaderboard.html" style="text-decoration:none">公開成績</a> <a class="btn sec" href="stats.html" style="text-decoration:none">統計分析</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note" id="cloud"></p></section></div><script>const API='https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec';const Q=[['角色認知','資深技術員要進一步成為合格現場幹部，最需要增加的是？',['把自己的技術速度再提高','將更多重要工作集中由自己完成','開始對團隊工作安排、結果與問題負責','減少現場作業，專門處理行政工作'],2],['角色認知','技術與管理比例變化圖主要想表達什麼？',['職位越高，技術能力應逐步降低','職位提升後，工作重心會逐步增加帶人、管理與改善','現場主管不需要再了解實際製程','每個職位都有固定的實際工時比例'],1],['標準化管理','新任組長認為只要把自己的經驗告訴大家就夠了，最需要補強哪個觀念？',['經驗仍有價值，但應逐步轉成可共同遵循的標準','當組長後應完全停止使用個人經驗','只要工作能完成，就不需要特別調整','經驗應只保留給資深人員使用'],0],['團隊帶領','哪種情況最能表示從「會做」開始進入「會帶」？',['自己操作速度比其他人快','能在別人遇到問題時教導、協助並確認對方理解','發現問題後立即自己處理完成','對自己的成品質量特別要求'],1],['團隊帶領','組長幾乎所有困難工作都親自處理，最大的風險是？',['組長技術可能退步','部屬容易過度依賴組長，團隊能力無法建立','組長與主管溝通會減少','現場紀錄可能太多'],1],['團隊帶領','組長接手熟手工作以追回進度，最大的不足是？',['組長不應參與現場作業','雖完成進度，但沒有確認速度變慢原因與改善方式','應直接調離員工','只要進度完成就代表正確'],1],['團隊帶領','資深員工認為自己做最快最不易出錯，最適當處理方式是？',['繼續全部交給資深員工','直接要求新人自行操作','將經驗整理成教導重點與標準，再安排新人逐步學習並確認結果','等離職後再交接'],2],['工作安排','早上安排完成，中午因設備等待延誤兩小時，最需要修正的觀念是？',['工作安排應完全由主管負責','工作安排不是一次性動作，還要持續掌握進度並適時調整','設備問題與組長無關','安排後不應再變更'],1],['異常判斷','品質異常時組長停工後只回報「請主管處理」，還缺少哪一部分？',['不應停止作業','不應向主管回報','應先掌握現況、做基本判斷與必要處置，再清楚回報已知資訊','應先找出誰做錯'],2],['改善思維','同一小缺失連續出現三次，哪種判斷最符合「會改善」？',['處理速度快就不用再處理','沒有客訴就繼續修正','除了修正當下問題，還應分析重複原因並調整做法或標準','直接加強處罰'],2],['角色認知','組長只關心自己區域，不關心前後製程，最大的限制是？',['巡視次數不夠','缺少整體流程與前後製程成果觀念','應停止管理自己區域','只需要對自己區域負責'],1],['團隊帶領','組員遇到問題都直接叫組長處理，半年後能力沒進步，最主要問題是？',['技術能力太強','解決問題太快','一直停留在會做，沒有真正轉向會帶','與組長無關'],2],['溝通回報','哪種交期落後回報最符合幹部能力？',['今天就是人不夠','今天延誤兩小時，主因上午缺一人加上某工序等待；目前已調整人力，預計下午補回一小時','我已經叫大家快一點','這不是我的問題'],1],['標準化管理','同一作業有兩種做法且都能完成，最符合標準化管理的是？',['讓每個人繼續用習慣方法','只採用年資最久的方法','比較兩種做法的結果與要求，確認適合的標準方式並共同遵循','沒客訴就不用統一'],2],['異常判斷','新人速度只有資深員工70%，最符合幹部觀念的思考順序是？',['先換人','先判斷是不熟練、方法不對、標準不清或安排不合，再決定處理方式','速度慢就不適合','讓資深員工接回'],1],['品質管理','數量與交期都達成，但未確認品質，最能說明哪個觀念？',['品質由下一站負責','管理不能只看完成，還要確認做對、做穩','數量與品質無關','品質只屬於品管責任'],1],['角色認知','最能代表「會管」與「會帶」差別的是？',['會帶偏向教人與協助；會管進一步掌握安排、人員、進度與異常','會帶只需要技術；會管完全不需要技術','會帶負責新人；會管只負責資深人員','兩者沒有差異'],0],['溝通回報','組長說「今天他們做得比較慢」，最大問題是？',['回答速度太慢','只描述表面現象，沒有掌握現場狀況與問題','組長不應回報進度','應交由生管說明'],1],['團隊帶領','哪種行為最接近「管人就是催、罵、要求」的錯誤觀念？',['說明要求後確認理解','進度落後只要求快一點，但不確認原因','作業錯誤時重說標準','人力不足時調整工作'],1],['標準化管理','幹部說「大家都做很多年，不需留紀錄」，最合適回應是？',['資深人員就沒問題','沒客訴就可以','重要經驗仍應轉成標準與紀錄，以利穩定與傳承','所有工作都立即製完整SOP'],2],['角色認知','新任幹部認為「每個人把自己事情做好就好」，最大衝突是？',['幹部需比所有人更熟練','幹部需要從個人作業視角轉向整體現場與團隊成果','幹部必須每天與每個人聊天','幹部不應參與現場工作'],1],['角色認知','哪一位最接近成熟現場幹部？',['技術最好、所有問題都自己處理','能快速要求大家完成產量','能安排工作、帶人、掌握品質與異常，並持續改善','所有異常都立即向主管回報'],2],['現場管理','每天注意人員、進度、品質、異常、安全與現場，主要強調什麼？',['每天必須填六份表單','責任不是只分配工作，而是持續掌握現場狀況','取代所有主管工作','每項狀況都親自處理'],1],['角色認知','哪一段最能完整代表本堂角色與責任？',['技術熟練→自己完成→快速處理問題','工作安排→催促進度→錯誤後修正','技術為基礎→帶著團隊做好→掌握現場→持續改善','技術減少→管理增加→最後完全行政'],2],['現場管理','產量與品質達標，但工具未歸位、動線凌亂、新人不清楚明日工作，最適當看法是？',['今天達標代表管理完成','這些與幹部無關','幹部仍應處理現場秩序與工作銜接，因為管理不只看當日產量','明天再提醒即可'],2]];let cur=0,A=Array(Q.length).fill(null),st=null;function startQuiz(){st=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}function render(){let q=Q[cur];pt.textContent=`第 ${cur+1}/${Q.length} 題`;at.textContent=`已作答 ${A.filter(x=>x!==null).length} 題`;pb.style.width=`${(cur+1)/Q.length*100}%`;qn.textContent=`QUESTION ${String(cur+1).padStart(2,'0')}｜${q[0]}`;qt.textContent=q[1];choices.innerHTML='';q[2].forEach((c,i)=>{let b=document.createElement('button');b.className='choice'+(A[cur]===i?' sel':'');b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>{A[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}function nextQ(){if(A[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submit()}function prevQ(){if(cur>0){cur--;render()}}function domains(){let m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(A[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}function grade(s){return s>=90?'觀念掌握良好':s>=80?'具備基本幹部觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}async function submit(){let c=Q.reduce((n,q,i)=>n+(A[i]===q[3]),0),s=Math.round(c/Q.length*100),d=domains(),co=code.value.trim(),em=email.value.trim(),payload={course:'第一堂｜現場幹部的角色與責任',code:co,email:em,publicOpt:pub.checked,date:new Date().toISOString().slice(0,10),score:s,correct:c,total:Q.length,answers:A,domains:d,startedAt:st.toISOString(),finishedAt:new Date().toISOString()};quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(co||'匿名')+'｜'+payload.date;score.textContent=s+' 分';band.textContent=grade(s);correct.textContent=`答對 ${c}/${Q.length}`;let w=Object.entries(d).sort((a,b)=>a[1]-b[1]).slice(0,3);weak.innerHTML='<h3>較需要加強</h3>'+w.map(([k,v])=>`<span class="pill">${k} ${v}%</span>`).join('');review.innerHTML='';Q.forEach((q,i)=>{if(A[i]!==q[3])review.innerHTML+=`<div style="padding:14px 0;border-top:1px solid var(--l)"><b>${i+1}. ${q[1]}</b><div class="err">你的答案：${'ABCD'[A[i]]}. ${q[2][A[i]]}</div><div class="ok">正確答案：${'ABCD'[q[3]]}. ${q[2][q[3]]}</div></div>`});try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}),x=await r.json();cloud.textContent=x.ok?'成績已送出雲端'+(em?'，Email 成績通知已寄送。':'。'):'雲端寫入失敗'}catch(e){cloud.textContent='目前無法連線雲端，請稍後再試。'}}function toggleReview(){review.classList.toggle('hide')}</script></body></html>
