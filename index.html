<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜現場幹部課後測驗</title><style> :root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:24px 18px}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:28px}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:32px}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px 16px;margin:10px 0;font-size:17px}.choice.sel{border:2px solid var(--n);background:#edf4fb}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}h1{font-size:26px}}</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>現場幹部的角色與責任</h1><div class="sub">第一堂｜課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗以現場情境判斷為主。完成後會立即顯示成績與能力面向；若填寫 Email，系統會寄送個人成績通知。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><label><input id="pub" type="checkbox" style="width:auto"> 同意公開「代號／匿名＋分數＋日期」（Email 永不公開）</label><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">Email 留空仍可作答；有填寫才寄送成績。</p></section><section id="quiz" class="c hide"><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div style="margin-top:18px"><button class="btn" onclick="toggleReview()">查看錯題</button> <a class="btn sec" href="leaderboard.html" style="text-decoration:none">公開成績</a> <a class="btn sec" href="stats.html" style="text-decoration:none">統計分析</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note" id="cloud"></p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";const Q=[["角色認知", "一名資深技術員技術熟練，也能獨立處理自己的工作問題。若升任現場幹部，最需要增加哪一種能力？", ["能掌握團隊工作及結果", "能處理更困難的技術工作", "能減少參與現場實際作業", "能獨自完成更多重要工作"], 0], ["角色認知", "「資深技術員 → 儲備幹部 → 現場組長 → 現場主管」這個發展過程主要代表什麼？", ["職位提升後應逐步退出現場", "技術工作逐漸由其他人取代", "工作重心逐步增加管理責任", "技術能力的重要性逐步降低"], 2], ["標準化管理", "一位新任組長認為：「以前怎麼做有效，現在照著以前的方法教大家就可以。」較適當的觀念是？", ["先保留老師傅原有的方法不變", "將有效經驗整理成共同做法", "讓每位員工選自己熟悉的方法", "等發生問題後再建立作業標準"], 1], ["團隊帶領", "下列哪一種情況最能表示一個人開始從「會做」進入「會帶」？", ["遇到問題時能很快自己處理", "自己的作業品質比其他人穩定", "能完成較複雜且困難的工作", "能教導他人並確認是否理解"], 3], ["團隊帶領", "某組長習慣把困難工作全部接過來自己做，短期進度很好，但其他人很少有機會處理問題。長期最可能造成什麼情況？", ["團隊對組長產生高度依賴", "組長與主管之間溝通減少", "現場作業速度逐漸變得更快", "資深人員承擔較少品質責任"], 0], ["團隊帶領", "下午發現進度落後約一小時，原因可能是新人速度較慢。組長若自己接手，當天大概可以追回進度；但新人之後仍需繼續負責這項工作。此時較適當的處理方式是？", ["由組長直接接手，先確保今天達成交期", "先由熟手完成今天工作，隔天再重新教新人", "維持原安排，讓新人自己累積操作熟練度", "先確認新人卡在哪裡，再決定支援或調整工作"], 3], ["團隊帶領", "一項重要工作長期只有一位資深員工會做。他認為：「我自己做最快，也最不容易出錯。」組長較適當的作法是？", ["先維持現況，以確保品質穩定", "直接讓新人獨立操作累積經驗", "整理關鍵做法並逐步安排傳承", "等訂單較少時再考慮技能移轉"], 2], ["工作安排", "組長早上已完成工作分配，中午發現設備等待造成某項工作延誤兩小時。此時較適當的作法是？", ["維持原本計畫，避免現場一直變動", "重新掌握進度並視情況調整安排", "等設備恢復後再確認是否需要處理", "將進度問題交由生管重新安排即可"], 1], ["異常判斷", "作業員發現產品疑似異常，但目前還不能確定是否超出標準。後面製程正在等料，若立即停工可能影響當天進度。組長較適當的第一步是？", ["先暫停疑似異常品流轉，確認狀況與依據", "先讓生產繼續，待有明確不良證據再處理", "先請主管決定是否停工，避免自己判斷錯誤", "先挑出明顯異常品，其餘產品繼續往下生產"], 0], ["改善思維", "同一項缺失一個月內發生三次，第一次是新人操作，第二次是熟手操作，第三次發生在不同班別。每次修正後都可以正常出貨。此時最值得優先確認的是？", ["哪一位作業員犯錯次數最多", "是否需要增加成品檢查頻率", "是否應改由最熟練的人固定負責", "問題是否來自共同作業方法或標準"], 3], ["角色認知", "某組的產量與品質都符合要求，但組長完全不關心前後製程是否等待或塞車。這種管理方式最主要缺少什麼？", ["對本組每日產量的掌握能力", "對整體流程與成果的理解", "對人員工作效率的追蹤能力", "對本區設備狀態的確認能力"], 1], ["團隊帶領", "某組長技術很好，組員遇到問題時都直接找他處理。半年後，組員解決問題的能力仍沒有提升。最需要調整的是哪個作法？", ["增加組長處理問題的速度", "降低員工接觸困難工作的機會", "引導員工參與判斷與處理過程", "將較困難的問題全部交給主管"], 2], ["溝通回報", "今天進度落後兩小時。現場同時存在：①一名人員請假 ②某設備等待30分鐘 ③新人速度低於熟手 ④下午又收到一張急單。主管詢問目前狀況，哪個回報較符合幹部角色？", ["缺一人、設備等待與新人速度共同影響，目前先調整既有工作並評估急單插入後的完成時間", "今天事情比較多，加上缺人，所以進度比較慢", "目前落後兩小時，正在調整人力，應可追回部分進度", "主要問題是突然加入急單，若沒有急單原本進度應該可以完成"], 0], ["標準化管理", "同一項工作，兩位資深員工有兩種不同作法，目前兩種方式都能完成產品。組長較適當的處理方式是？", ["讓兩位人員維持各自熟悉方式", "優先採用年資最久人員的方式", "暫時不調整，等出現問題再討論", "比較兩種結果後確認共同標準"], 3], ["異常判斷", "新人作業速度只有熟手約七成，但品質正常。現場今天人力不足，若換熟手接手可以立即提高產量，但新人若一直沒有實作機會也很難提升能力。組長較適當的做法是？", ["讓新人繼續全程操作，避免影響學習進度", "由熟手全面接手，先以當日產量為主要考量", "將工作拆分，在交期與新人練習之間調整配置", "先把新人調往簡單工作，等人力充足再重新安排"], 2], ["品質管理", "某項工作數量達成、交期正常，但組長沒有確認品質就讓產品進入下一站。這反映哪一個管理問題？", ["工作安排缺少人力彈性", "只看完成，沒有確認做對", "現場分工沒有明確責任", "異常回報沒有完整紀錄"], 1], ["角色認知", "「會帶」與「會管」最大的差異較接近哪一項？", ["會帶以技術為主，會管以行政為主", "會帶負責新人，會管負責資深人員", "會帶重在教導，會管進一步掌握整體", "會帶主要對人，會管主要對設備負責"], 2], ["溝通回報", "某組連續三天都比計畫晚約30分鐘完成。組長認為：「每天最後都有做完，所以問題不大。」若你是更上一層主管，最應要求組長先做什麼？", ["要求全組每天提早30分鐘開始工作", "要求組長每天延長時間確保完成", "將產量目標暫時降低以符合現況", "找出每天延遲是否存在相同原因"], 3], ["團隊帶領", "看到工作進度落後時，下列哪一種作法最接近「管人就是催、罵、要求」的錯誤觀念？", ["只要求大家加快速度，沒有進一步確認原因", "先詢問卡住原因，再確認需要什麼協助", "先調整工作順序，再觀察進度是否改善", "先確認人力狀況，再重新分配相關工作"], 0], ["標準化管理", "資深員工說：「這項工作大家做很多年了，根本不需要留下紀錄。」幹部較適當的觀念是？", ["熟手作業可以不記錄，新人再建立即可", "穩定的經驗仍應逐步轉為標準與紀錄", "只要品質沒有異常，就不需額外紀錄", "有客戶要求時再開始建立相關資料"], 1], ["角色認知", "某新任幹部認為：「每個人把自己的事情做好就好了。」這個觀念與幹部角色最大的差異是？", ["幹部應該比所有員工更熟悉技術", "幹部應該減少自己參與現場工作", "幹部必須開始看團隊及整體成果", "幹部應該把所有工作重新分配一次"], 2], ["角色認知", "以下四位人員都具備良好技術能力。哪一位最接近成熟的現場幹部？", ["發生問題時能最快親自排除，讓生產立即恢復", "每天能確保產量達成，必要時自己補足人力缺口", "能把工作清楚分配，異常則立即交由主管決定", "能掌握人員與進度，遇到問題處理後也追蹤是否再發"], 3], ["現場管理", "幹部每天除了進度與品質，還要注意人員、異常、安全與現場狀況。主要代表什麼？", ["幹部需要持續掌握整體現場", "幹部每天需要填寫更多管理表單", "幹部需要親自處理所有現場問題", "幹部需要取代其他單位進行管理"], 0], ["角色認知", "下列哪個發展順序最符合本堂課的幹部成長概念？", ["會做 → 會管 → 會帶 → 會改善", "會帶 → 會做 → 會改善 → 會管", "會做 → 會帶 → 會管 → 會改善", "會改善 → 會做 → 會帶 → 會管"], 2], ["現場管理", "今天下午即將下班，本組產量與品質均已達標。但現場仍有：①工具尚未歸位 ②一項異常尚未留下紀錄 ③新人不知道明天第一項工作 ④下一站反映有一批產品資訊不清楚。組長最適當的處理原則是？", ["今日產量已完成，其餘列入明日第一件工作", "先處理會影響後續作業與交接的事項，再完成現場收尾", "先整理5S，其餘交由明天當班人員接續處理", "先讓人員正常下班，組長自己留下處理所有問題"], 1]];let cur=0,ans=Array(Q.length).fill(null),startedAt=null;
function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function startQuiz(){startedAt=new Date();document.getElementById('start').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render()}
function render(){const q=Q[cur];pt.textContent=`第 ${cur+1} / ${Q.length} 題`;at.textContent=`已作答 ${ans.filter(x=>x!==null).length} 題`;pb.style.width=`${(cur+1)/Q.length*100}%`;qn.textContent=`QUESTION ${String(cur+1).padStart(2,'0')}`;qt.textContent=q[1];choices.innerHTML='';q[2].forEach((c,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}
function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}function prevQ(){if(cur>0){cur--;render()}}
function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}
function band(s){return s>=90?'觀念掌握良好':s>=80?'具備基本幹部觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),score=Math.round(correct/Q.length*100),domains=domainScores(),code=document.getElementById('code').value.trim(),email=document.getElementById('email').value.trim(),pub=document.getElementById('pub').checked,date=localDate();const payload={course:'第一堂｜現場幹部的角色與責任',code,email,publicOpt:pub,date,score,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code||'匿名')+'｜'+date;document.getElementById('score').textContent=score+' 分';document.getElementById('band').textContent=band(score);document.getElementById('correct').textContent=`答對 ${correct}/${Q.length}`;
const vals=Object.values(domains);const min=Math.min(...vals);let title='',items=[];if(min>=90){title='各能力面向皆掌握良好';items=[]}else if(min>=80){title='可再精進的面向';items=Object.entries(domains).sort((a,b)=>a[1]-b[1]).slice(0,3)}else{title='較需要加強';items=Object.entries(domains).sort((a,b)=>a[1]-b[1]).filter(x=>x[1]<80).slice(0,3)};weak.innerHTML=`<h3>${title}</h3>`+(items.length?items.map(([k,v])=>`<span class="pill">${k} ${v}%</span>`).join(''):'<p class="ok">本次無明顯弱項，整體觀念掌握良好。</p>');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+=`<div style="padding:14px 0;border-top:1px solid var(--l)"><b>${i+1}. ${q[1]}</b><div class="err">你的答案：${'ABCD'[ans[i]]}. ${q[2][ans[i]]}</div><div class="ok">正確答案：${'ABCD'[q[3]]}. ${q[2][q[3]]}</div></div>`});try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await r.json();cloud.textContent=d.ok?'成績已送出雲端'+(email?'，Email 成績通知已寄送。':'。'):'雲端寫入失敗：'+(d.error||'未知錯誤')}catch(e){cloud.textContent='目前無法連線雲端，請稍後再試。'}}
function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
