<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨達｜考生練習統計</title>
<style>
*{box-sizing:border-box}body{margin:0;border-top:14px solid #1f3e63;background:#f4f7fa;color:#1f2937;font:16px/1.5 "Microsoft JhengHei",system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:24px}h1{margin:14px 0 4px;color:#1f3e63}a{color:#1f3e63}p{margin:8px 0 16px}.table-wrap{overflow:auto;border:1px solid #dbe3ec;border-radius:12px;background:white}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:10px 12px;text-align:center;border-bottom:1px solid #dbe3ec}thead th{background:#edf3f9;color:#1f3e63}tbody th{font-weight:600}tbody tr:nth-child(even){background:#f8fafc}tr:last-child td,tr:last-child th{border-bottom:0}thead tr:first-child th{border-bottom:1px solid #dbe3ec}th[scope=row],td:nth-child(2){text-align:left}[hidden]{display:none!important}@media(max-width:640px){main{padding:16px}}
</style>
</head>
<body>
<main>
<a href="admin.html">← 返回晨達測驗管理中心</a>
<h1>考生練習統計</h1>
<p id="status" role="status">正在確認管理員權限…</p>
<div id="results" hidden>
<p>輪次顯示「已練習／已完成」。作答題數包含各輪作答，不重複題數按每堂題號計算。</p>
<div class="table-wrap" tabindex="0" role="region" aria-label="考生練習統計資料表">
<table aria-label="各考生第一堂與第二堂練習統計">
<colgroup span="3"></colgroup><colgroup span="5"></colgroup><colgroup span="5"></colgroup>
<thead>
<tr><th rowspan="2" scope="col">工號</th><th rowspan="2" scope="col">英文姓名</th><th rowspan="2" scope="col">綁定狀態</th><th colspan="5" scope="colgroup">第一堂</th><th colspan="5" scope="colgroup">第二堂</th></tr>
<tr><th scope="col">輪次</th><th scope="col">作答</th><th scope="col">答對</th><th scope="col">正確率</th><th scope="col">不重複題數</th><th scope="col">輪次</th><th scope="col">作答</th><th scope="col">答對</th><th scope="col">正確率</th><th scope="col">不重複題數</th></tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec';
const status=document.getElementById('status');
const rows=document.getElementById('rows');
const results=document.getElementById('results');
function returnToLogin(){
  status.textContent='請先從測驗管理中心登入管理員帳號，再開啟這個頁面。';
}
async function load(){
  try{
    const token=sessionStorage.getItem('chendaAdminToken');
    if(!token){returnToLogin();return;}
    const response=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'adminCandidatePracticeStats',token})
    });
    const data=await response.json();
    if(data.code==='ADMIN_SESSION_EXPIRED'){
      sessionStorage.removeItem('chendaAdminToken');
      returnToLogin();
      return;
    }
    if(!response.ok||!data.ok||!Array.isArray(data.rows))throw Error('LOAD_FAILED');
    const bindings={ACTIVE:'已綁定',RELEASED:'已解除',UNBOUND:'未綁定'};
    const fragment=document.createDocumentFragment();
    for(const employee of data.rows){
      const tr=document.createElement('tr');
      const id=document.createElement('th');
      id.scope='row';
      id.textContent=employee.employeeId;
      tr.appendChild(id);
      const cells=[employee.englishName||'—',bindings[employee.bindingStatus]||'—'];
      for(const course of employee.courses){
        cells.push(course.rounds+'／'+course.completedRounds,course.answered,course.correct,
          course.correctRate===null?'—':course.correctRate+'%',course.uniqueQuestions);
      }
      for(const value of cells)tr.insertCell().textContent=value;
      fragment.appendChild(tr);
    }
    rows.replaceChildren(fragment);
    status.textContent='正式考生共 '+data.rows.length+' 位';
    results.hidden=false;
  }catch(_){
    status.textContent='無法讀取練習統計，請重新整理再試。';
  }
}
load();
window.addEventListener('pagehide',()=>{
  rows.replaceChildren();
  results.hidden=true;
  status.textContent='正在確認管理員權限…';
});
window.addEventListener('pageshow',event=>{if(event.persisted)load();});
</script>
</body>
</html>
