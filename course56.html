n}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}.choice{font-size:21px;padding:17px 16px}.w{padding:12px 10px}.c{padding:18px 14px}.result-actions{flex-direction:column}}
</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>新人帶教、現場溝通與工作交接</h1><div class="sub">第5、6堂｜合併課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗以新人帶教、現場溝通與工作交接情境判斷為主。完成後會立即顯示成績、能力面向與錯題檢討。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">考試日期由系統自動記錄；Email 留空仍可作答。</p></section><section id="quiz" class="c hide"><div class="quiz-actions"><button class="btn sec" onclick="backToStart()">← 返回測驗入口</button></div><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div class="result-actions"><button class="btn" onclick="toggleReview()">查看錯題</button><a class="btn sec" href="leaderboard.html?courseId=C05">公開成績</a><a class="btn sec" href="stats.html?courseId=C05">統計分析</a><a class="btn sec" href="leader-training.html">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note" id="cloud"></p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}let startedAt=null;
const Q=[["新人帶教", "新人第一次學習一項新的作業，幹部採取哪一種帶教方式最合適？", ["先示範完整作業，請新人自行練習，等有空時再確認最後成果", "先說明並實際示範，讓新人動手操作，再依結果補充說明", "先把工令、圖面與注意事項一次講完，再由新人自行完成", "請資深同事先代替新人操作，等新人熟悉環境後再開始練習"], 1], ["工作交代", "現場幹部要交代一項工作，哪一種說法最清楚完整？", ["阿明，先處理這一批兩件產品，速度盡量快，完成後放在原來的位置並回報", "阿明，先處理工令260705-01，今天有空時完成，做完放到附近待製區並回報", "阿明，先把目前這批兩件產品做完，中午前交給下一站，其他細節照以前處理", "阿明，先處理工令260705-01的兩件產品，中午前完成備料，放到一樓待製區後回報"], 3], ["確認理解", "新人昨天學會一般規格，今天工令的規格有變更。他說：「跟昨天一樣，我懂。」在開始加工前，哪一種做法最能確認他真的理解差異？", ["請他指出新舊規格差異，說明操作重點後實作一次", "將新版工令放在工作台上，提醒他操作時隨時查看", "由幹部重新示範完整流程，請他站在旁邊仔細觀看", "安排資深同仁在旁陪同，發現操作偏差時立即提醒"], 0], ["帶教溝通", "新人第二次詢問同一個作業步驟時，幹部哪一種回應最合適？", ["我剛才已經說過了，你先照記得的方式完成", "這項操作並不困難，你多看資深同仁幾次就會", "哪個步驟還不清楚？你先說說目前理解到哪裡", "現在大家都在趕工作，等空閒時再一次說明"], 2], ["場合分寸", "一名新人連續兩次將完工品放錯待製區，已影響下一站取件。下列哪一種處理方式不符合「對事不對人與場合分寸」的做法？", ["在組內會議中重申待製區規則，並說明放錯可能造成的影響", "私下請新人說明判斷過程，再確認是否需要重新帶教", "在組內會議中說明當事人的判斷過程，請大家共同討論改善", "檢查工令與區域標示是否清楚，降低再次放錯的機會"], 2], ["分段帶教", "新人第一次操作一項包含多個步驟的工作時，幹部採取哪一種帶教方式較合適？", ["依作業環節分段帶教，完成一項、確認一項", "先把全部步驟完整講完，再請新人自行反覆練習", "由資深人員全程陪做，遇到錯誤時直接協助完成", "先讓新人完成整項工作，再依最後結果統一說明"], 0], ["獨立作業", "新人在旁邊有人提醒時已經做得完，但自己做仍會漏掉檢查步驟。這時幹部怎麼做比較合適？", ["直接整批交給他自己做，實際多做幾次自然就會熟", "每個步驟都繼續在旁提醒，確定不會錯了再放手", "先請熟手幫他把工作完成，之後有空再讓他練習", "少提醒一些讓他自己試，漏掉的步驟再帶他確認"], 3], ["跨語言溝通", "幹部要向中文還不熟的移工交代一項新工作，只靠口頭說明怕對方理解不同，怎麼做比較合適？", ["把中文說慢一點並多講幾遍，看他點頭就讓他開始", "搭配工令、圖面或樣品說明，再請他指出重點或做一次", "請會中文的同事代為轉達，自己只確認最後完成結果", "先讓他跟著熟手照著做，遇到問題時再重新說明"], 1], ["進度回報", "主管下午還要安排人力，現在詢問這批工作的進度。哪一種回報最能讓他馬上判斷要不要調人支援？", ["工令260715-02共10件，已完成6件，預計三點完成，暫時不用支援", "工令260715-02已完成6件，剩下部分照目前速度今天應該做得完", "這批總共10件，目前剩下4件，現場都在趕工，做完會馬上回報", "目前整體進度大約六成，預計下午完成，需要支援時會再通知"], 0], ["工作交接", "白班幹部要把未完成的工作交給晚班，哪一句最能讓接手的人不用再追問就可以開始？", ["這批還沒全部做完，材料都放在原來的位置，晚班接著處理就可以", "工令260715-02還差2件，照白班原來的做法繼續，有問題再問組長", "阿明接工令260715-02剩2件，凌晨三點前在一樓待製區完成並回報", "一樓待製區還有2件未完成，今天晚班要做完，完成後記得向組長回報"], 2], ["工作分派", "生管一次拿一疊工令交給現場幹部。幹部確認好先後順序後，接下來怎麼交代比較合適？", ["把整疊工令交給熟手，由他看現場情況自行安排", "依確認的順序逐張分派，說清楚誰做、何時完成", "把工令放在工作區，讓有空的人員自行拿取處理", "先口頭交代最急的工令，其餘放在旁邊之後再說"], 1], ["場合分寸", "現場同仁對公司新規定感到不滿，幹部也發現執行上有困難。下列哪一種做法不適合？", ["先聽完同仁的不滿，不急著反駁，再把話題帶回實際問題", "先說明意見會往上反映，但目前工作仍依現行規定執行", "私下關心情緒較大的同仁，等他冷靜後再了解困難原因", "把不滿的同仁集中在一起，共同討論規定不合理的地方"], 3], ["關懷溝通", "平常工作正常的同仁，今天明顯沒精神，工作速度也變慢。幹部怎麼做比較合適？", ["當場提醒他打起精神，不要因為個人狀況拖到整組進度", "先把他的工作分給其他人，等他願意主動說明時再談", "在大家面前問他發生什麼事情，請其他同仁一起關心", "私下問他是否需要協助，再確認今天的工作怎麼安排"], 3], ["差異說明", "資深同仁接到一張與平常產品相似，但板厚和法蘭方向不同的工令。他看了一眼說：「這個我做過。」幹部怎麼做比較合適？", ["從第一個步驟重新完整講一次，避免他受過去經驗影響", "提醒這次不同的地方，請他指出重點後再開始", "把新版工令和圖面交給他，讓他自己找出全部差異", "先讓他照平常方式做第一件，完成後再一起核對規格"], 1], ["工作交接", "白班已經在群組寫清楚：「哪張工令、還剩幾件、放在哪裡、幾點前要完成。」結果原本要接手的晚班同仁突然請假，換成另一個人做。白班幹部接下來怎麼做，才算真的有交接到？", ["群組都已經寫清楚了，晚班組長看到後自然會安排", "再把訊息貼一次並標記代班的人，看到已讀就可以", "直接找代班的人，跟他核對工令、位置和剩餘工作", "請原本接手的人私下轉告，白班不用再重複說明"], 2], ["確認理解", "新人每次聽完都說懂，但隔天常常又忘記作業順序。幹部怎麼做比較合適？", ["把步驟分段說明，請他記下重點並照著操作一次", "每天上工前重新講一遍，直到他能把內容全部記住", "安排熟手一直站在旁邊提醒，避免新人自行判斷出錯", "先讓他多看幾天別人操作，等熟悉後再讓他動手"], 0], ["場合分寸", "組內會議正在分派工作時，有同仁當著大家說：「為什麼比較難的工作又是我？」幹部怎麼回應比較合適？", ["「你技術比較好，這個本來就是你做，大家也都知道。」", "「我先說明這次怎麼安排，會後再聽聽你的想法。」", "「不然現在大家表決，看這項工作到底要交給誰做。」", "「好，那我先換別人，等一下再重新調整全部工作。」"], 1], ["一致教法", "兩位幹部教新人做同一項工作，教的順序卻不一樣。新人問：「你們講的不一樣，我到底要照誰的做？」這時怎麼做比較合適？", ["兩位幹部先確認哪些步驟有先後要求，講好後再一起教新人", "先照當班幹部教的方式做，等換班後，再配合另一位的做法", "先請年資比較深的幹部教，另一位暫時不要補充，避免新人混亂", "讓新人兩種方式都試試看，選自己做得比較順的，以後就照著做"], 0], ["獨立作業", "新人跟著熟手做了幾天，速度已經跟得上。他說：「我會了，可以自己做。」幹部怎麼確認比較合適？", ["問熟手他這幾天表現如何，熟手說沒問題，就讓他自己做", "看他做完的數量是否達標，數量跟得上，就讓他自己接著做", "請他自己做一件，觀察關鍵步驟，再請他指出要檢查的地方", "請他把操作順序完整說一次，說得出來，就安排他獨立作業"], 2], ["進度回報", "一張工令有10件風管，其中6件已焊好，這6件裡有4件已完成清洗。主管問：「這張工令現在做到哪？下午清洗的人力要怎麼排？」哪一種回報最合適？", ["「焊接完成6件，清洗完成4件，目前合計完成10件，下午可以接下一張。」", "「目前有4件清洗完成，其他還在處理，下午先照原本人力安排就好。」", "「焊接已經超過一半，清洗也有進度，下午應該可以全部做完。」", "「4件已清洗、2件焊好待洗、4件還沒焊好，下午清洗要配合焊接進度排。」"], 3], ["新人帶教", "新人問：「這一步為什麼一定要做？」幹部怎麼回答比較合適？", ["「大家一直都這樣做，你先照著做，做久了就習慣了。」", "「你先把動作練熟，等整套都會做了，我再跟你講原因。」", "「我拿這件指給你看，跟你說這一步在做什麼，沒做會怎樣。」", "「你先跟著熟手多做幾次，之後就會知道為什麼要做了。」"], 2], ["工作分派", "幹部請兩位同仁一起備料，兩人都以為數量會由對方確認，結果材料備好了，卻沒人清點。下次交代類似工作時，怎麼說比較合適？", ["「阿明負責備料，阿成核對規格和數量，確認好後由阿成回報。」", "「你們兩個一起備料，做好後互相看一下，沒問題就送過去。」", "「這批你們一起負責，誰先做完，誰就順便確認數量再回報。」", "「照上次的分工備料，這次記得多注意數量，完成後再通知我。」"], 0], ["工作協調", "主管上午交代工令甲今天要完成，下午另一位主管又要求先做工令乙。兩張都說急，但現有人力做不完。幹部怎麼處理比較合適？", ["先做下午才交代的工令乙，等工令甲的主管問起，再說明安排已改變", "把兩張的進度、交期和人力說清楚，請兩位主管確認先後，再向同仁交代", "請同仁兩張同時做、各完成一半，讓兩位主管都看得到工作有在推進", "依自己的經驗先選一張趕完，另一張延後的原因，等下班回報時一起說明"], 1], ["確認理解", "幹部交代：「這兩件風管清洗好後，放到指定位置，再回報我。」同仁回了一聲「好」，就準備開始做。幹部想確認他有沒有聽清楚，接著怎麼問比較合適？", ["「剛才講的都有聽懂吧？有不清楚的地方，記得先問我。」", "「這兩件你以前洗過吧？這次一樣，照之前的方式處理。」", "「要放哪裡應該知道吧？先開始做，我等一下再過來看。」", "「你指一下洗好要放哪裡，再跟我說做完後還要做什麼。」"], 3], ["獨立作業", "新人連續三天都由熟手在旁提醒，做出的產品也都合格。幹部準備安排他下週自己做，下列哪一個選項的判斷正確？", ["連續三天都合格，表示做法已經熟悉，可以安排他自己做", "目前只能確認有人提醒時做得好，還要看少了提醒能不能完成", "熟手最清楚新人的能力，只要熟手同意，就能安排他自己做", "新人能完整說出步驟，就表示已經理解，可以安排他獨立作業"], 1]];window.QUESTION_BANK=Q;let cur=0,ans=Array(Q.length).fill(null);
function startQuiz(){startedAt=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}function backToStart(){if(!confirm('確定要返回測驗入口嗎？目前已作答的內容將清除。'))return;cur=0;ans=Array(Q.length).fill(null);startedAt=null;quiz.classList.add('hide');start.classList.remove('hide')}function render(){pt.textContent=(cur+1)+' / '+Q.length+' 題';at.textContent='已作答 '+ans.filter(x=>x!==null).length+' 題';pb.style.width=((cur+1)/Q.length*100)+'%';qn.textContent='QUESTION '+String(cur+1).padStart(2,'0');qt.textContent=Q[cur][1];choices.innerHTML='';Q[cur][2].forEach((x,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent='ABCD'[i]+'. '+x;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}function prevQ(){if(cur>0){cur--;render()}}function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}function band(s){return s>=90?'帶教與溝通觀念掌握良好':s>=80?'具備基本帶教與溝通觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),s=Math.round(correct/Q.length*100),domains=domainScores(),date=localDate();quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code.value.trim()||'匿名')+'｜'+date;score.textContent=s+' 分';document.getElementById('band').textContent=band(s);document.getElementById('correct').textContent='答對 '+correct+'/'+Q.length;weak.innerHTML='<h3>帶教與溝通能力面向</h3>'+Object.entries(domains).sort((a,b)=>a[1]-b[1]).map(([k,v])=>'<span class="pill">'+k+' '+v+'%</span>').join('');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+='<div style="padding:14px 0;border-top:1px solid var(--l)"><b>'+(i+1)+'. '+q[1]+'</b><div class="err">你的答案：'+'ABCD'[ans[i]]+'. '+q[2][ans[i]]+'</div><div class="ok">正確答案：'+'ABCD'[q[3]]+'. '+q[2][q[3]]+'</div></div>'});try{const payload={course:'第5、6堂｜新人帶教、現場溝通與工作交接',courseId:'C05',code:code.value.trim(),email:email.value.trim(),publicOpt:false,date,score:s,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await resp.json();if(!d.ok)throw new Error(d.error||'寫入失敗');cloud.textContent='成績已成功記錄。'}catch(e){cloud.textContent='本次成績未能寫入後台，請告知管理者。'}}function toggleReview(){review.classList.toggle('hide')}
