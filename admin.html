<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜測驗管理中心</title><style>:root{--n:#1f3e63;--t:#2a8d8a;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--m:#6b7280;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937}.top{height:14px;background:var(--n)}.wrap{max-width:1040px;margin:auto;padding:30px 18px 46px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6312;padding:24px}.login{max-width:520px;margin:70px auto}.login h1,.dash h1{margin:0;color:var(--n);font-size:34px}.sub{color:var(--m);margin-top:8px}.login input{width:100%;padding:13px;border:1px solid var(--l);border-radius:10px;font-size:17px;margin:14px 0}.btn{border:0;border-radius:11px;padding:11px 15px;font-size:15px;font-weight:800;cursor:pointer;background:var(--n);color:#fff;text-decoration:none;display:inline-block}.btn.sec{background:#fff;color:var(--n);border:1px solid var(--l)}.err{color:var(--r);font-weight:700}.hide{display:none}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.module{background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 8px 24px #1f3e6312}.module .icon{font-size:30px}.module h2{color:var(--n);margin:12px 0 8px}.module p{color:var(--m);line-height:1.7;min-height:72px}.badge{display:inline-block;border-radius:999px;padding:6px 10px;font-weight:800;font-size:13px;margin-bottom:14px}.online{background:#e8f5ee;color:#2f855a}.building{background:#fff4da;color:#8a6112}.foot{margin-top:24px;text-align:right;color:var(--m);font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.head{flex-direction:column}.login h1,.dash h1{font-size:28px}}</style></head><body><div class="top"></div><main class="wrap"><section id="login" class="card login"><h1>管理員登入</h1><div class="sub">晨達線上測驗平台｜管理入口</div><input id="pin" type="password" inputmode="numeric" placeholder="請輸入管理 PIN"><button class="btn" onclick="loginAdmin()">登入管理中心</button> <a class="btn sec" href="index.html">返回平台首頁</a><p id="msg" class="err"></p></section><section id="dash" class="dash hide"><div class="head"><div><h1>晨達測驗管理中心</h1><div class="sub">選擇要管理的測驗系統</div></div><div><a class="btn sec" href="index.html">返回平台首頁</a> <button class="btn sec" onclick="logout()">登出</button></div></div><div class="grid"><article class="module"><div class="icon">👥</div><h2>現場幹部培訓管理</h2><span class="badge online">已上線</span><p>管理8堂培訓課程、作答人次、平均分、能力分析、排行榜與資料匯出。</p><a class="btn" href="leader-admin.html">進入培訓管理</a></article><article class="module"><div class="icon">🎧</div><h2>移工中文聽力鑑定管理</h2><span class="badge building">整合建置中</span><p>未來管理批次、A/B/C/D版本、成績、排名、各能力面向與CSV匯出。</p><a class="btn sec" href="chinese-listening.html">查看整合入口</a></article></div><div class="foot">晨達企業｜測驗管理中心　平台版本 V1.0｜2026-09-08</div></section></main><script>const API='https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec';let token=sessionStorage.getItem('chendaAdminToken')||'';if(token)showDash();async function post(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});return r.json();}async function loginAdmin(){msg.textContent='';const p=pin.value.trim();if(!p){msg.textContent='請輸入管理 PIN。';return;}try{const d=await post({action:'adminLogin',pin:p});if(!d.ok){msg.textContent=d.error||'登入失敗。';return;}token=d.token;sessionStorage.setItem('chendaAdminToken',token);showDash();}catch(e){msg.textContent='目前無法連線管理後端。';}}function showDash(){login.classList.add('hide');dash.classList.remove('hide');}function logout(){sessionStorage.removeItem('chendaAdminToken');location.reload();}</script></body></html>
