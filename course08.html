<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第八堂｜基礎改善與數據管理｜課後測驗</title><style>
:root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:18px}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:18px}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:28px}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:34px}h2{font-size:28px;line-height:1.45}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-size:18px;font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px 20px;margin:12px 0;font-size:22px;line-height:1.5;cursor:pointer}.choice.sel{border:2px solid var(--n);background:#edf4fb}.quiz-actions{display:flex;justify-content:flex-end;margin-bottom:14px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}.choice{font-size:21px;padding:17px 16px}.w{padding:12px 10px}.c{padding:18px 14px}}
</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>基礎改善與數據管理</h1><div class="sub">第八堂｜課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗共25題單選題；交卷時會自動記錄第八堂考試日期與本次成績歷史。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">考試日期由系統自動記錄，考生不用輸入；Email 仍可留空。</p><div class="note" style="margin-top:18px;text-align:right">第八堂｜題庫 V1.1</div></section><section id="quiz" class="c hide"><div class="quiz-actions"><button class="btn sec" onclick="backToStart()">← 返回測驗入口</button></div><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px"><button class="btn" onclick="toggleReview()">查看錯題</button><a class="btn sec" href="leader-training.html" style="text-decoration:none">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note">本次作答已記錄考試日期與成績歷史。</p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";
function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
let startedAt=null;
const Q=[["資料判讀","現場大家都很忙，幹部最應先判斷什麼？",["今天加班人數多少","哪些時間真正有產出","現場人員是否都在動","今天完成件數多少"],1],["紀錄與表單","現場使用表單最主要的目的為何？",["留下現場發生的事情","增加主管簽核的資料","統一所有部門的格式","證明每天都有做紀錄"],0],["紀錄與表單","哪一組最接近有效紀錄應包含的內容？",["人員、主管、部門、結果","日期、班別、職稱、簽名","工單、設備、品名、主管","時間、對象、事實、數量、影響"],3],["資料判讀","多筆紀錄累積後最大的價值是什麼？",["比較容易做漂亮報表","看出問題是否重複發生","可以減少所有人工紀錄","可以直接找到問題原因"],1],["管理資料","本堂所說的「管理資料」主要用途是什麼？",["保存所有現場數字","取代幹部現場判斷","幫助看現況與差異","專門用來考核人員"],2],["紀錄與表單","下列哪一筆設備紀錄比較有管理價值？",["折床今天狀況不好","折床最近常常異常","折床需要再注意一下","10:20停機，11:05恢復"],3],["紀錄與表單","較完整的現場日報，最適合包含哪一組？",["基本資料、人力、進度、異常、交接","產量、主管簽名、員工心得、備註","工單、客戶名稱、價格、交貨方式","出勤、薪資、設備編號、員工評語"],0],["資料判讀","白板原本只寫「完成105件」，補上「計畫80件」後，多了什麼價值？",["可以證明品質很好","可以比較計畫與實際","可以證明人力足夠","可以確認設備正常"],1],["管理資料","想知道設備停機多久，至少要留下哪兩個時間？",["上班與下班時間","工單開始與完成時間","停機與恢復時間","點檢與簽核時間"],2],["管理資料","要知道不良率，最基本要先有什麼資料？",["確認量與不良數","人數與工作時間","工單數與設備數","計畫量與交貨量"],0],["紀錄與表單","哪一組最屬於設備／物料紀錄？",["出勤、交接、人力安排","不良、返工、品質判定","產量、進度、完成狀況","停機、缺料、等待時間"],3],["資料判讀","連續4天待料30、45、60、40分鐘，目前最合理的判斷是？",["第三天管理最差","待料已重複發生","物料人員一定有錯","下週一定還會缺料"],1],["資料判讀","哪一句已經從「感覺」變成較具體的資料？",["品質最近不太穩","焊接最近常有問題","本週同類不良5件","這問題以前也有過"],2],["改善觀念","哪一項最符合「改善不一定是大工程」？",["減少每天找工具的時間","全面更換工廠設備","重做整套管理制度","導入大型資訊系統"],0],["管理資料","哪一個順序最符合本堂邏輯？",["管理資料 → 紀錄 → 現場","改善 → 資料 → 紀錄","報表 → 現場 → 改善","紀錄 → 累積 → 管理資料"],3],["資料判讀","現場有人趕工、有人返工、有人等料、有人找工具。大家都很忙，幹部最好怎麼看？",["有事情做就代表效率正常","分辨產出時間與損耗時間","只看今天總完成件數","只要不停工就沒有問題"],1],["管理資料","白板有完成量、不良率、達交率、安全異常等資料，幹部較好的做法是？",["只看完成量最高的項目","先看交期，其他暫時不管","綜合不同面向一起判斷","只挑最差的一項來處理"],2],["改善觀念","現場一直說「最近常缺料」，如果想知道是不是常態，第一步最適合做什麼？",["記錄次數、時間與影響","先要求採購提出改善","直接列入人員考核","先增加所有材料庫存"],0],["管理資料","哪一組資料最有機會形成可靠的管理資料？",["最近很忙、品質變差","員工姓名、部門、年資","主管評語、工作態度","完成量、不良數、停機時間"],3],["改善觀念","過去缺料都沒有留下紀錄，現在最適合先做哪件事？",["立即增加安全庫存","先找出責任部門","開始記錄缺料與等待","直接設定缺料目標值"],2],["紀錄與表單","一張簡單但完整的日報，最應優先包含哪些內容？",["日期、產量、簽名、備註","基本、人力、進度、異常、交接","工單、員工、客戶、主管","出勤、設備、成本、價格"],1],["紀錄與表單","「設備異常」和「10:20停機，11:05恢復」最大的差別是什麼？",["後者可以累積與追蹤","後者已經找到根本原因","前者比較適合主管閱讀","前者才算正式紀錄"],0],["改善觀念","為了怕來不及，現場長期大量提早生產並堆放半成品，較合理的理解是？",["提早生產一定比較好","庫存越多表示效率越高","只要沒延誤就沒有浪費","過度提早可能帶來庫存損耗"],3],["改善觀念","哪一句最符合「紀錄」與「管理資料」的關係？",["有管理資料後就不用留原始紀錄","管理資料主要靠主管經驗判斷","紀錄累積後才能形成管理資料","數字合理就不必確認來源"],2],["改善觀念","哪一條路徑最符合本堂最後的管理觀念？",["發現問題 → 設目標 → 找責任人 → 補紀錄","發生事情 → 留下紀錄 → 累積資料 → 看見問題","發生事情 → 主管判斷 → 找人處理 → 結案","建立表單 → 排名人員 → 找出表現差者"],1]];let cur=0,ans=Array(Q.length).fill(null);
function startQuiz(){startedAt=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}
function backToStart(){if(!confirm('確定要返回測驗入口嗎？目前已作答的內容將清除。'))return;cur=0;ans=Array(Q.length).fill(null);startedAt=null;quiz.classList.add('hide');start.classList.remove('hide')}
function render(){pt.textContent=(cur+1)+' / '+Q.length+' 題';at.textContent='已作答 '+ans.filter(x=>x!==null).length+' 題';pb.style.width=((cur+1)/Q.length*100)+'%';qn.textContent='QUESTION '+String(cur+1).padStart(2,'0');qt.textContent=Q[cur][1];choices.innerHTML='';Q[cur][2].forEach((x,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent='ABCD'[i]+'. '+x;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}
function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}
function prevQ(){if(cur>0){cur--;render()}}
function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}
function band(s){return s>=90?'觀念掌握良好':s>=80?'具備基本幹部觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),s=Math.round(correct/Q.length*100),domains=domainScores(),date=localDate();quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code.value.trim()||'匿名')+'｜'+date;score.textContent=s+' 分';document.getElementById('band').textContent=band(s);document.getElementById('correct').textContent='答對 '+correct+'/'+Q.length;const items=Object.entries(domains).sort((a,b)=>a[1]-b[1]);weak.innerHTML='<h3>四大學習面向</h3>'+items.map(([k,v])=>'<span class="pill">'+k+' '+v+'%</span>').join('');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+='<div style="padding:14px 0;border-top:1px solid var(--l)"><b>'+(i+1)+'. '+q[1]+'</b><div class="err">你的答案：'+'ABCD'[ans[i]]+'. '+q[2][ans[i]]+'</div><div class="ok">正確答案：'+'ABCD'[q[3]]+'. '+q[2][q[3]]+'</div></div>'});try{const payload={course:'第八堂｜基礎改善與數據管理',courseId:'C08',code:code.value.trim(),email:email.value.trim(),publicOpt:false,date,score:s,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await resp.json();if(!d.ok)throw new Error(d.error||'寫入失敗')}catch(e){alert('本次成績日期未能寫入後台，請告知管理者。')}}
function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
