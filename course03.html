<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜第三堂課後測驗</title><style>
:root{--n:#1f3e63;--o:#f39a14;--bg:#f4f7fa;--l:#dbe3ec;--g:#2f855a;--r:#c53030}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:18px}.top{height:14px;background:var(--n)}.w{max-width:980px;margin:auto;padding:18px}.c{background:#fff;border:1px solid var(--l);border-radius:18px;box-shadow:0 8px 24px #1f3e6314;padding:28px}h1,h2,h3{color:var(--n)}h1{margin:0;font-size:34px}h2{font-size:28px;line-height:1.45}.sub{color:#6b7280;margin-top:8px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{background:var(--o);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-size:18px;font-weight:700;cursor:pointer;background:var(--n);color:#fff}.sec{background:#eef3f8;color:var(--n)}.hide{display:none}.prog{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden}.prog>div{height:100%;background:var(--o)}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px 20px;margin:12px 0;font-size:22px;line-height:1.5;cursor:pointer}.choice.sel{border:2px solid var(--n);background:#edf4fb}.quiz-actions{display:flex;justify-content:flex-end;margin-bottom:14px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.score{font-size:64px;font-weight:900;color:var(--n)}.pill{display:inline-block;background:#eef3f8;color:var(--n);border-radius:999px;padding:8px 12px;font-weight:700;margin:4px}.err{color:var(--r);font-weight:700}.ok{color:var(--g);font-weight:700}.note{color:#6b7280;font-size:13px;line-height:1.6}@media(max-width:720px){.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav{flex-direction:column}.btn{width:100%}.choice{font-size:21px;padding:17px 16px}.w{padding:12px 10px}.c{padding:18px 14px}.result-actions{flex-direction:column}}
</style></head><body><div class="top"></div><div class="w"><section id="start" class="c"><div class="hero"><div><h1>品質意識與自主檢查</h1><div class="sub">第三堂｜課後測驗</div></div><div class="badge">25題單選題</div></div><p>本測驗以現場品質情境判斷為主。完成後會立即顯示成績、能力面向與錯題檢討。</p><div class="grid"><label>代號（選填）<input id="code" placeholder="例如 A001"></label><label>Email（選填）<input id="email" type="email" placeholder="name@example.com"></label></div><div style="margin-top:18px"><button class="btn" onclick="startQuiz()">開始測驗</button></div><p class="note">考試日期由系統自動記錄；Email 留空仍可作答。</p></section><section id="quiz" class="c hide"><div class="quiz-actions"><button class="btn sec" onclick="backToStart()">← 返回測驗入口</button></div><div style="display:flex;justify-content:space-between;color:#6b7280;margin-bottom:8px"><span id="pt"></span><span id="at"></span></div><div class="prog"><div id="pb"></div></div><div id="qn" style="color:var(--o);font-weight:800;margin-top:22px"></div><h2 id="qt"></h2><div id="choices"></div><div class="nav"><button class="btn sec" id="prev" onclick="prevQ()">上一題</button><button class="btn" id="next" onclick="nextQ()">下一題</button></div></section><section id="result" class="c hide"><div class="hero"><div><div class="sub" id="who"></div><div class="score" id="score"></div><h2 id="band"></h2></div><div class="badge" id="correct"></div></div><div id="weak"></div><div class="result-actions"><button class="btn" onclick="toggleReview()">查看錯題</button><a class="btn sec" href="leaderboard.html?courseId=C03">公開成績</a><a class="btn sec" href="stats.html?courseId=C03">統計分析</a><a class="btn sec" href="leader-training.html">返回培訓首頁</a></div><div id="review" class="hide" style="margin-top:20px"></div><p class="note" id="cloud"></p></section></div><script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}let startedAt=null;
const Q=[
["品質標準","客戶圖面標示尺寸公差為 ±0.2 mm，公司針對此產品正式訂定的作業標準為 ±0.1 mm。現場生產時應依哪個標準執行？",["依公司 ±0.1 mm 標準","依客戶 ±0.2 mm 標準，較容易完成生產","由作業人員依加工狀況自行選擇標準","兩個標準都先不採用，等產品完成後再決定"],0],
["量測判斷","塗裝人員量測同一件產品時，發現膜厚數值忽高忽低。此時最先應確認什麼？",["立即增加每件產品的量測次數，並將全部數值完整記錄","先調整塗裝條件，避免後續產品出現相同的膜厚差異","膜厚計的電量、歸零及量測狀態","更換另一位人員重新量測，再比較兩人的量測結果"],2],
["品質保證","下列哪一項最符合「品質保證」的主要作法？",["找出完成品中的不良產品並集中處理","建立規範流程，降低產品問題","記錄每天產品的檢查結果與完成數量","處理客戶退回的異常產品並安排修整"],1],
["共同責任","幹部發現同一項工作，不同人員使用不同做法時，最適合先做什麼？",["先確認正確做法，再統一要求","讓各人沿用自己最熟悉的方式完成工作","請品管決定作業方法，現場依結果執行","等產品實際發生問題後，再討論如何調整"],0],
["製造三不","收到上一站送來的產品，發現外觀有明顯變形時，應該如何處理？",["暫停使用，先確認產品狀況","先投入生產，再觀察後續組裝是否會受影響","由現場自行修整，再依照原定進度繼續作業","與其他良品共同放置，等待主管巡視時處理"],0],
["製造三不","下列哪一項最不符合「不製造不良」的做法？",["作業開始前確認圖面內容與材料規格","生產過程依照正確作業條件進行操作","發現異常時先確認原因及可能影響範圍","明知設備異常仍繼續生產"],3],
["自主檢查","開始生產新工單前，為了避免做錯產品規格，應確認哪一組資料？",["生產數量、完成時間以及預定交貨日期","工單、圖面、材料及設備條件","人員出勤、工作分配以及預定休息時間","下站空間、搬運工具以及預定交接人員"],1],
["首件確認","準備生產一批新規格產品時，哪一種做法最符合「第一次就把事情做對」？",["先確認首件符合要求，再繼續生產","先完成整批產品，再統一安排尺寸及外觀檢查","先依過去經驗製作，發現差異時再調整做法","先交給下一道工序，再確認產品是否能夠使用"],0],
["品質標準","新工單標示使用 Z12 鍍鋅板，但客戶圖面標示為 Z18；過去相似產品則多使用 Z12。備料前應如何處理？",["先確認本次應採用的正式規格","依照過去相似產品的材料進行備料","先使用庫存較充足的材料完成前段加工","由現場人員依交期與加工經驗自行決定"],0],
["品質風險","某類產品的塗裝膜厚已連續多批符合規格，客戶與公司也未要求每件量測。主管若要調整膜厚抽測頻率，最適合依據什麼？",["作業人員希望每天減少多少量測工作","當天的生產進度是否已經落後原定排程","量測工具目前是否有人使用或需要借用","歷史結果、製程變化與品質風險"],3],
["品質保證","客戶反映產品組裝時不順利，但出貨前品檢曾判定合格。此時哪一種處理最符合「對客戶品質保證」？",["由品檢人員單獨負責，重新檢查當時的產品","請業務先向客戶說明，產品出貨前已經檢查合格","共同追查圖面、材料、製程與檢查條件","將責任交給最後一道製程，要求該單位提出改善"],2],
["共同責任","首件檢查合格後，作業員發現設備聲音與平常不同。幹部應如何處理？",["保持原有生產方式，等尺寸超規後再處理","降低設備運轉速度，完成本批後安排檢查","增加產品抽驗數量，產品合格便繼續生產","先確認設備與產品狀況，再決定後續作業"],3],
["製造三不","準備加工時，材料外觀看起來正常，但材料標示的工單編號與手上的工單不同。此時最適合怎麼做？",["材料外觀正常即可先使用，之後再補確認編號","先區分放置，確認工單與材料規格是否相符","詢問附近同仁是否看過這批材料即可使用","先加工首件，只要成品外觀正常就繼續生產"],1],
["製造三不","加工途中發現現場板材的厚度標示與工單不一致，但已經完成1件產品。此時最適合怎麼做？",["停止使用該批材料，隔離並確認已完成品","先將剩餘材料用完，再一次確認整批產品","已完成品保留使用，後續改用正確厚度材料","比較兩種材料的加工難度，再決定是否更換"],0],
["製造三不","產品準備交給下一站時，作業人員發現焊道外觀與平常不同，但無法自行判斷是否合格。此時最適合怎麼做？",["先交給下一站，請下一站使用時再協助判斷","將產品區分放置，並請相關人員共同確認","只要焊道沒有明顯破裂，就可以正常移交","先自行補焊一次，再依補焊後的外觀決定"],1],
["檢驗標準","現場請QC協助檢驗一項產品，但工單與圖面都沒有註明該項目的允收標準。此時最適合怎麼處理？",["由QC依過往檢驗經驗自行訂定允收範圍","先挑選外觀看起來較好的產品判定為合格","請現場主管提出希望的結果，再由QC照此判定","先確認標準來源及允收條件，再進行判定"],3],
["品質職責","下列哪一項最符合「品檢員」與「品管」的工作差異？",["品檢員負責制定產品標準，品管再依標準執行","品管只在產品完成後，負責挑出所有不良品","品檢員依標準判定，品管著重預防與控制","兩者工作內容相同，只是使用的職稱不一樣"],2],
["首件確認","新產品尚未確認首件，作業人員為了趕進度，先完成整批產品。這種做法最大的品質風險是什麼？",["首件檢查會占用設備，影響後續排程安排","加工條件若有誤，可能造成整批產品異常","整批完成後，品檢人員需要花更多時間檢查","作業人員可能忘記填寫當天的生產數量紀錄"],1],
["共同責任","銳角處理人員準備將產品交給下一個塗裝站時，發現部分邊角仍有毛刺。此時最適合怎麼做？",["先移交產品，再口頭提醒下一站注意毛刺","完成本工序應有的處理並確認後再移交","將毛刺位置做記號，交由下一站決定是否處理","混入其他產品一起移交，最後再由品檢確認"],1],
["原因判斷","同類變形連續出現三批，三批由不同人員作業，但都使用同一台設備，材料與作業方式也無明顯變更。最應優先調查什麼？",["要求三位作業人員重新接受操作訓練","增加成品檢查次數，避免不良流到客戶端","將三批不良品完成修正後，再依原方式生產","共用設備及關鍵加工條件"],3],
["製造三不","急單共20件，準備交給下一站時發現其中3件外觀變形；主管正在處理其他事情，下一站也在等待。此時最適合怎麼做？",["將20件全部移交，請下一站作業時再協助挑選","先自行修整3件異常品，再與其他產品一起移交","將20件全部留在現場，等主管有空後再逐件處理","隔離3件，並確認其餘產品與異常範圍"],3],
["持續改善","某項不良每次都能在出貨前被檢查出來，但相同問題仍持續發生。下一步最適合怎麼做？",["提高檢查頻率，避免不良產品再次流到客戶","更新檢查表單，要求人員增加各項紀錄內容","分析原因，改善流程並追蹤結果","安排熟練人員，專門負責挑選及修整不良品"],2],
["自主檢查","一批20件產品，首件檢查合格；加工到第12件時，發現折彎角度異常，但第2至第11件尚未逐件確認。此時最適合怎麼做？",["調整設備後繼續生產，完工時再統一進行檢查","只隔離第12件，其餘依照首件結果判定為合格","先完成剩餘8件，再確認整批是否都有相同問題","修正該件問題，並追查第2至第11件"],3],
["製造三不","上游將明顯變形的零件交給目前工序；作業人員因趕進度仍繼續組裝，造成變形加重，最後又直接交給下一站。這個過程違反了哪些「三不原則」？",["主要違反不接受不良，其餘兩項沒有直接影響","主要違反不製造不良，與產品移交沒有關係","不接受、不製造及不流出不良，三項都違反","下一站如果能夠攔截，就不算違反製造三不"],2],
["影響範圍","產品準備出貨時，發現推車最上方的產品有外觀撞傷；搬運前的檢查紀錄顯示10件均正常。此時最適合怎麼做？",["修整撞傷的1件，其餘9件依原檢查結果直接出貨","將撞傷產品移除，其餘9件改放另一台車後再出貨","重新確認10件，並追查搬運與堆放過程","搬運前已有檢查紀錄，應交由搬運人員負責處理"],2]
];window.QUESTION_BANK=Q;let cur=0,ans=Array(Q.length).fill(null);
function startQuiz(){startedAt=new Date();start.classList.add('hide');quiz.classList.remove('hide');render()}function backToStart(){if(!confirm('確定要返回測驗入口嗎？目前已作答的內容將清除。'))return;cur=0;ans=Array(Q.length).fill(null);startedAt=null;quiz.classList.add('hide');start.classList.remove('hide')}function render(){pt.textContent=(cur+1)+' / '+Q.length+' 題';at.textContent='已作答 '+ans.filter(x=>x!==null).length+' 題';pb.style.width=((cur+1)/Q.length*100)+'%';qn.textContent='QUESTION '+String(cur+1).padStart(2,'0');qt.textContent=Q[cur][1];choices.innerHTML='';Q[cur][2].forEach((x,i)=>{const b=document.createElement('button');b.className='choice'+(ans[cur]===i?' sel':'');b.textContent='ABCD'[i]+'. '+x;b.onclick=()=>{ans[cur]=i;render()};choices.appendChild(b)});prev.disabled=cur===0;next.textContent=cur===Q.length-1?'送出答案':'下一題'}function nextQ(){if(ans[cur]===null){alert('請先選擇答案');return}if(cur<Q.length-1){cur++;render()}else submitQuiz()}function prevQ(){if(cur>0){cur--;render()}}function domainScores(){const m={};Q.forEach((q,i)=>{m[q[0]]??={c:0,t:0};m[q[0]].t++;if(ans[i]===q[3])m[q[0]].c++});return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,Math.round(v.c/v.t*100)]))}function band(s){return s>=90?'品質觀念掌握良好':s>=80?'具備基本品質觀念':s>=70?'部分觀念需要加強':'建議重新複習本堂內容'}
async function submitQuiz(){const correct=Q.reduce((n,q,i)=>n+(ans[i]===q[3]?1:0),0),s=Math.round(correct/Q.length*100),domains=domainScores(),date=localDate();quiz.classList.add('hide');result.classList.remove('hide');who.textContent=(code.value.trim()||'匿名')+'｜'+date;score.textContent=s+' 分';document.getElementById('band').textContent=band(s);document.getElementById('correct').textContent='答對 '+correct+'/'+Q.length;weak.innerHTML='<h3>品質能力面向</h3>'+Object.entries(domains).sort((a,b)=>a[1]-b[1]).map(([k,v])=>'<span class="pill">'+k+' '+v+'%</span>').join('');review.innerHTML='';Q.forEach((q,i)=>{if(ans[i]!==q[3])review.innerHTML+='<div style="padding:14px 0;border-top:1px solid var(--l)"><b>'+(i+1)+'. '+q[1]+'</b><div class="err">你的答案：'+'ABCD'[ans[i]]+'. '+q[2][ans[i]]+'</div><div class="ok">正確答案：'+'ABCD'[q[3]]+'. '+q[2][q[3]]+'</div></div>'});try{const payload={course:'第三堂｜品質意識與自主檢查',courseId:'C03',code:code.value.trim(),email:email.value.trim(),publicOpt:false,date,score:s,correct,total:Q.length,answers:ans,domains,startedAt:startedAt?.toISOString(),finishedAt:new Date().toISOString()};const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const d=await resp.json();if(!d.ok)throw new Error(d.error||'寫入失敗');cloud.textContent='成績已成功記錄。'}catch(e){cloud.textContent='本次成績未能寫入後台，請告知管理者。'}}function toggleReview(){review.classList.toggle('hide')}
</script></body></html>
