<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>統計分析｜晨達現場幹部培訓</title><style>
:root{--navy:#1f3e63;--orange:#f39a14;--bg:#f4f7fa;--line:#dbe3ec;--muted:#6b7280;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:18px}.top{height:14px;background:var(--navy)}.wrap{max-width:1120px;margin:auto;padding:26px 18px 42px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(31,62,99,.08);padding:30px}h1,h2{color:var(--navy)}h1{margin:0;font-size:36px}h2{font-size:28px;margin-top:28px}.sub,.note{color:var(--muted);font-size:17px;line-height:1.6}.hero{display:flex;justify-content:space-between;gap:18px;align-items:center}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#eef3f8;color:var(--navy)}.danger{background:#fff1f0;color:var(--bad);border:1px solid #f3c7c3}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:20px;font-size:17px}.metric b{display:block;font-size:34px;color:var(--navy);margin-top:6px}.bar{height:14px;background:#e7edf4;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange)}table{width:100%;border-collapse:collapse;font-size:17px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--navy);font-size:17px}.review-row{cursor:pointer}.review-row:hover,.review-row:focus{background:#fff8ec;outline:2px solid var(--orange);outline-offset:-2px}.review-link{color:var(--navy);font-weight:800;text-decoration:underline}.modal{position:fixed;inset:0;background:#17253a99;display:grid;place-items:center;padding:20px;z-index:20}.modal[hidden]{display:none}.review-card{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 70px #10203866}.review-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.review-head h2{margin:0}.close{border:0;background:#eef3f8;color:var(--navy);width:44px;height:44px;border-radius:50%;font-size:26px;cursor:pointer}.option{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}.option.correct{border:2px solid #2f855a;background:#edf9f1}.option-top{display:flex;justify-content:space-between;gap:16px}.dist{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden;margin-top:9px}.dist span{display:block;height:100%;background:#7890ad}.correct .dist span{background:#2f855a}.review-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.admin{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}.version{margin-top:24px;text-align:right;color:var(--muted);font-size:15px}@media(max-width:720px){body{font-size:17px}.hero{flex-direction:column;align-items:flex-start}.hero-actions{width:100%;justify-content:flex-start}.metrics{grid-template-columns:1fr}.btn{width:100%;text-align:center}.card,.review-card{padding:22px}h1{font-size:30px}h2{font-size:24px}.sub,.note,table,.metric{font-size:16px}.review-nav{flex-direction:column}}
</style></head><body><div class="top"></div><div class="wrap"><div class="card"><div class="hero"><div><h1>培訓統計分析</h1><div class="sub">以5大能力面向觀察整體理解程度</div></div><div class="hero-actions"><a class="btn secondary" href="leader-admin.html">← 返回管理中心</a><a class="btn secondary" href="course01.html">← 返回測驗</a></div></div>
<div id="status" class="note" style="margin:18px 0"></div>
<div class="metrics"><div class="metric"><span>作答人數</span><b id="m1">—</b></div><div class="metric"><span>平均分數</span><b id="m2">—</b></div><div class="metric"><span>最高分</span><b id="m3">—</b></div><div class="metric"><span>80分以上</span><b id="m4">—</b></div></div>
<h2>5大能力面向正確率</h2><div id="domains"></div>
<h2>最常答錯 TOP 5</h2><table><thead><tr><th>題號</th><th>題目內容</th><th>能力面向</th><th>答錯人次</th><th>正確率</th></tr></thead><tbody id="wrong"></tbody></table>
<div style="margin-top:20px"><button class="btn secondary" onclick="exportCsv()">匯出統計 CSV</button></div>
<div class="admin"><h2>管理功能</h2><p class="note">僅供管理者清除測試／歷史成績。清除後無法復原，Google Sheet 欄位標題會保留。</p><button class="btn danger" onclick="clearHistory()">清除歷史成績</button></div>
<div class="version">系統版本 V1.5｜更新日期 2026-10-02</div>
</div></div>
<div id="reviewDialog" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="reviewTitle"><section class="review-card"><div class="review-head"><div><div id="reviewMeta" class="sub"></div><h2 id="reviewTitle"></h2></div><button class="close" onclick="closeReview()" aria-label="關閉題目檢討">×</button></div><div id="reviewOptions"></div><h3>作答分布</h3><p id="reviewStats" class="note"></p><div class="review-nav"><button id="reviewPrev" class="btn secondary" onclick="moveReview(-1)">← 上一題</button><button id="reviewNext" class="btn secondary" onclick="moveReview(1)">下一題 →</button></div></section></div>
<iframe id="questionBankFrame" hidden title="題庫資料"></iframe>
<script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";let DATA=null,QUESTION_BANK=[],reviewIndex=0;const courseId=new URLSearchParams(location.search).get('courseId')||'C01';
function loadQuestionBank(){return new Promise(resolve=>{const f=document.getElementById('questionBankFrame');f.onload=()=>{QUESTION_BANK=f.contentWindow.QUESTION_BANK||[];resolve();};f.src=courseId==='C02'?'course02.html':'course01.html';});}
async function load(){const st=document.getElementById('status');try{await loadQuestionBank();const r=await fetch(API+'?action=stats&courseId='+encodeURIComponent(courseId));DATA=await r.json();m1.textContent=DATA.count;m2.textContent=DATA.avgScore+'分';m3.textContent=DATA.maxScore+'分';m4.textContent=DATA.pass80+'%';domains.innerHTML='';wrong.innerHTML='';Object.entries(DATA.domains).sort((a,b)=>a[1]-b[1]).forEach(([k,v])=>domains.innerHTML+=`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:17px"><b>${k}</b><span>${v}%</span></div><div class="bar"><span style="width:${v}%"></span></div></div>`);DATA.topWrong.forEach(x=>wrong.innerHTML+=`<tr class="review-row" tabindex="0" onclick="openReview(${x.id})" onkeydown="if(event.key==='Enter'||event.key===' ')openReview(${x.id})"><td><span class="review-link">Q${x.id}</span></td><td>${escapeHtml(x.question||'—')}</td><td>${escapeHtml(x.domain)}</td><td>${x.wrongCount}</td><td>${x.correctRate}%</td></tr>`);if(!DATA.topWrong.length)wrong.innerHTML='<tr><td colspan="5">目前沒有錯題資料</td></tr>';st.textContent='統計已更新｜點選題目可進行考後檢討';}catch(e){st.textContent='統計讀取失敗';}}
function openReview(questionId){reviewIndex=Math.max(0,Math.min(QUESTION_BANK.length-1,Number(questionId)-1));renderReview();reviewDialog.hidden=false;document.body.style.overflow='hidden';}
function closeReview(){reviewDialog.hidden=true;document.body.style.overflow='';}
function moveReview(step){reviewIndex=Math.max(0,Math.min(QUESTION_BANK.length-1,reviewIndex+step));renderReview();}
function renderReview(){const q=QUESTION_BANK[reviewIndex];if(!q)return;const stat=(DATA.topWrong||[]).find(x=>x.id===reviewIndex+1)||{},counts=stat.answerCounts||[],total=DATA.count||0;reviewMeta.textContent=`Q${reviewIndex+1}｜${q[0]}｜正確率 ${stat.correctRate??'—'}%`;reviewTitle.textContent=q[1];reviewOptions.innerHTML=q[2].map((option,i)=>{const count=counts[i]||0,pct=total?Math.round(count/total*100):0,correct=i===q[3];return `<div class="option ${correct?'correct':''}"><div class="option-top"><b>${'ABCD'[i]}. ${escapeHtml(option)} ${correct?'✓ 正確答案':''}</b><span>${count} 人｜${pct}%</span></div><div class="dist"><span style="width:${pct}%"></span></div></div>`;}).join('');reviewStats.textContent=`共 ${total} 人作答｜答錯 ${stat.wrongCount??0} 人｜未選各選項者不列入選項人數`;reviewPrev.disabled=reviewIndex===0;reviewNext.disabled=reviewIndex===QUESTION_BANK.length-1;}
reviewDialog.addEventListener('click',e=>{if(e.target===reviewDialog)closeReview();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!reviewDialog.hidden)closeReview();});
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function exportCsv(){if(!DATA)return;let csv='\uFEFF項目,數值\n作答人數,'+DATA.count+'\n平均分數,'+DATA.avgScore+'\n最高分,'+DATA.maxScore+'\n80分以上比例,'+DATA.pass80+'%\n\n能力面向,正確率\n'+Object.entries(DATA.domains).map(([k,v])=>`${k},${v}%`).join('\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='現場幹部培訓_統計.csv';a.click();URL.revokeObjectURL(u);}
async function clearHistory(){const token=sessionStorage.getItem('chendaAdminToken')||'';if(!token){alert('管理員登入已失效，請返回管理中心重新登入。');return;}const confirmText=prompt('此操作無法復原。若確定清除全部歷史成績，請輸入 DELETE：');if(confirmText!=='DELETE'){alert('已取消：確認文字不正確。');return;}if(!confirm('最後確認：確定要清除全部歷史成績嗎？'))return;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'clearAll',token,confirm:'DELETE'})});const d=await r.json();if(!d.ok){alert('清除失敗：'+(d.error||'未知錯誤'));return;}alert(`已清除 ${d.deleted} 筆歷史成績。`);await load();}catch(e){alert('清除失敗：目前無法連線雲端。');}}
load();
</script></body></html>
