<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>統計分析｜晨達現場幹部培訓</title><style>
:root{--navy:#1f3e63;--orange:#f39a14;--bg:#f4f7fa;--line:#dbe3ec;--muted:#6b7280;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#1f2937;font-size:18px}.top{height:14px;background:var(--navy)}.wrap{max-width:1120px;margin:auto;padding:26px 18px 42px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(31,62,99,.08);padding:30px}h1,h2{color:var(--navy)}h1{margin:0;font-size:36px}h2{font-size:28px;margin-top:28px}.sub,.note{color:var(--muted);font-size:17px;line-height:1.6}.hero{display:flex;justify-content:space-between;gap:18px;align-items:center}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#eef3f8;color:var(--navy)}.danger{background:#fff1f0;color:var(--bad);border:1px solid #f3c7c3}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.metric{border:1px solid var(--line);border-radius:14px;padding:20px;font-size:17px}.metric b{display:block;font-size:34px;color:var(--navy);margin-top:6px}.bar{height:14px;background:#e7edf4;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange)}table{width:100%;border-collapse:collapse;font-size:17px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--navy);font-size:17px}.admin{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}.version{margin-top:24px;text-align:right;color:var(--muted);font-size:15px}@media(max-width:720px){body{font-size:17px}.hero{flex-direction:column;align-items:flex-start}.hero-actions{width:100%;justify-content:flex-start}.metrics{grid-template-columns:1fr}.btn{width:100%;text-align:center}.card{padding:22px}h1{font-size:30px}h2{font-size:24px}.sub,.note,table,.metric{font-size:16px}}
</style></head><body><div class="top"></div><div class="wrap"><div class="card"><div class="hero"><div><h1>培訓統計分析</h1><div class="sub">以5大能力面向觀察整體理解程度</div></div><div class="hero-actions"><a class="btn secondary" href="leader-admin.html">← 返回管理中心</a><a class="btn secondary" href="course01.html">← 返回測驗</a></div></div>
<div id="status" class="note" style="margin:18px 0"></div>
<div class="metrics"><div class="metric"><span>作答人數</span><b id="m1">—</b></div><div class="metric"><span>平均分數</span><b id="m2">—</b></div><div class="metric"><span>最高分</span><b id="m3">—</b></div><div class="metric"><span>80分以上</span><b id="m4">—</b></div></div>
<h2>5大能力面向正確率</h2><div id="domains"></div>
<h2>最常答錯 TOP 5</h2><table><thead><tr><th>題號</th><th>能力面向</th><th>正確率</th></tr></thead><tbody id="wrong"></tbody></table>
<div style="margin-top:20px"><button class="btn secondary" onclick="exportCsv()">匯出統計 CSV</button></div>
<div class="admin"><h2>管理功能</h2><p class="note">僅供管理者清除測試／歷史成績。清除後無法復原，Google Sheet 欄位標題會保留。</p><button class="btn danger" onclick="clearHistory()">清除歷史成績</button></div>
<div class="version">系統版本 V1.4｜更新日期 2026-09-08</div>
</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec";let DATA=null;
async function load(){const st=document.getElementById('status');try{const r=await fetch(API+'?action=stats');DATA=await r.json();m1.textContent=DATA.count;m2.textContent=DATA.avgScore+'分';m3.textContent=DATA.maxScore+'分';m4.textContent=DATA.pass80+'%';domains.innerHTML='';wrong.innerHTML='';Object.entries(DATA.domains).sort((a,b)=>a[1]-b[1]).forEach(([k,v])=>domains.innerHTML+=`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:17px"><b>${k}</b><span>${v}%</span></div><div class="bar"><span style="width:${v}%"></span></div></div>`);DATA.topWrong.forEach(x=>wrong.innerHTML+=`<tr><td>Q${x.id}</td><td>${x.domain}</td><td>${x.correctRate}%</td></tr>`);st.textContent='統計已更新';}catch(e){st.textContent='統計讀取失敗';}}
function exportCsv(){if(!DATA)return;let csv='\uFEFF項目,數值\n作答人數,'+DATA.count+'\n平均分數,'+DATA.avgScore+'\n最高分,'+DATA.maxScore+'\n80分以上比例,'+DATA.pass80+'%\n\n能力面向,正確率\n'+Object.entries(DATA.domains).map(([k,v])=>`${k},${v}%`).join('\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='現場幹部培訓_統計.csv';a.click();URL.revokeObjectURL(u);}
async function clearHistory(){const pin=prompt('請輸入管理 PIN：');if(pin===null)return;const confirmText=prompt('此操作無法復原。若確定清除全部歷史成績，請輸入 DELETE：');if(confirmText!=='DELETE'){alert('已取消：確認文字不正確。');return;}if(!confirm('最後確認：確定要清除全部歷史成績嗎？'))return;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'clearAll',pin:pin,confirm:'DELETE'})});const d=await r.json();if(!d.ok){alert('清除失敗：'+(d.error||'未知錯誤'));return;}alert(`已清除 ${d.deleted} 筆歷史成績。`);await load();}catch(e){alert('清除失敗：目前無法連線雲端。');}}
load();
</script></body></html>
