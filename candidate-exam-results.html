<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨達｜正式考試成績</title><style>*{box-sizing:border-box}body{margin:0;border-top:12px solid #1f3e63;background:#f4f7fa;color:#243246;font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:22px}h1{color:#1f3e63}.card{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:18px;margin:15px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cad4df}button{background:#1f3e63;color:white;cursor:pointer}input{flex:1}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{background:#edf3f9;border-radius:9px;padding:14px;flex:1;min-width:150px}.stats strong{display:block;font-size:26px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#edf3f9}#detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}#detail>div{padding:14px 18px;background:#f4f7fa;border:1px solid #dbe3ec;border-radius:10px;min-width:0}#detail dt{color:#617187;font-size:14px;margin-bottom:5px}#detail dd{margin:0;font-size:19px;font-weight:600;overflow-wrap:anywhere}#detail .wide{grid-column:1/-1}#detail .score{background:#edf3f9}#detail .score dd{font-size:30px;color:#1f3e63}@media(max-width:600px){#detail{grid-template-columns:1fr}}</style></head><body><main><a href="admin.html?v=35.2&return=exam-results">← 返回管理中心</a><h1>六堂正式考試成績｜Formal Exam Results</h1><p>需先登入管理員。僅顯示後端授權取得的真實紀錄。</p><div class="card"><div class="controls"><select id="course"><option value="">全部課程</option><option value="01">第一堂</option><option value="02">第二堂</option><option value="03">第三堂</option><option value="04">第四堂</option><option value="05">第五堂</option><option value="06">第六堂</option></select><input id="search" placeholder="搜尋工號或姓名"><button id="refresh">重新整理</button></div><p id="status" role="status">正在確認權限…</p></div><div id="content" hidden><div class="stats"><div>交卷筆數<strong id="count">0</strong></div><div>平均分數<strong id="avg">—</strong></div><div>考生人數<strong id="people">0</strong></div></div><div class="card scroll"><table><thead><tr><th>工號</th><th>姓名</th><th>課程</th><th>分數</th><th>答對／題數</th><th>交卷時間</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>尚無符合條件的紀錄。</p></div><div class="card" id="details" hidden><h2>成績明細</h2><dl id="detail"></dl></div></div></main><script>
const API='https://script.google.com/macros/s/AKfycbxlvoVmUVJCmrrG6_gFWc5Nl3N_sBG0Wjnu1xnn4CtLnBt0kQI_mq5LPuKepMSSCE0E/exec',E=id=>document.getElementById(id);let all=[];
function courseId(r){return /^0[1-6]$/.test(r.courseSlot||'')?r.courseSlot:''}
function showDetail(r){
 const root=E('detail');root.replaceChildren();
 const fields=[['工號',r.employeeId],['姓名',r.name],['考試課程',r.courseName||r.courseId||r.course,'wide'],['考試分數',r.score===null||r.score===undefined?'—':r.score+' 分','score'],['答對題數',String(r.correct??'—')+' / '+String(r.total??'—')+' 題'],['開始時間',r.startedAt],['交卷時間',r.finishedAt]];
 for(const [label,value,cls] of fields){const item=document.createElement('div'),title=document.createElement('dt'),content=document.createElement('dd');if(cls)item.className=cls;title.textContent=label;content.textContent=value||'—';item.append(title,content);root.append(item)}
 E('details').hidden=false;
}
function render(){let c=E('course').value,k=E('search').value.toLowerCase().trim(),a=all.filter(r=>(!c||courseId(r)===c)&&(!k||String(r.employeeId||'').toLowerCase().includes(k)||String(r.name||'').toLowerCase().includes(k)));E('count').textContent=a.length;E('people').textContent=new Set(a.map(r=>String(r.employeeId||''))).size;let scores=a.map(r=>Number(r.score)).filter(Number.isFinite);E('avg').textContent=scores.length?(scores.reduce((x,y)=>x+y,0)/scores.length).toFixed(1):'—';E('rows').replaceChildren();E('empty').hidden=a.length>0;E('details').hidden=true;for(let r of a){let tr=document.createElement('tr');for(let v of [r.employeeId||'—',r.name||'—',r.courseName||r.courseId||r.course||'—',r.score??'—',String(r.correct??'—')+' / '+String(r.total??'—'),r.finishedAt||'—']){let td=tr.insertCell();td.textContent=v}let td=tr.insertCell(),b=document.createElement('button');b.textContent='查看';b.onclick=()=>showDetail(r);td.append(b);let del=document.createElement('button');del.textContent='刪除';del.style.background='#b42318';del.style.marginLeft='8px';del.disabled=!r.rowId;del.onclick=()=>deleteOne(r,del);td.append(del);E('rows').append(tr)}}
async function deleteOne(r,button){
 if(!confirm('確定刪除工號 '+r.employeeId+' 的這一筆成績？\n課程：'+r.courseName+'\n交卷：'+r.finishedAt+'\n刪除前會保留備份。'))return;
 const token=sessionStorage.getItem('chendaAdminToken');
 if(!token){E('status').textContent='請返回管理中心重新登入。';E('content').hidden=true;return}
 button.disabled=true;E('status').textContent='正在刪除這一筆成績…';
 try{
  const response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'deleteSelected',token,rowIds:[r.rowId]})});
  const data=await response.json();
  if(!response.ok||!data.ok||data.deleted!==1)throw Error(data.error||'刪除未完成，請重新整理後重試。');
  await load();E('status').textContent+=' 已刪除 1 筆，原始資料已備份。';
 }catch(error){E('status').textContent=error.message||'連線失敗，請重新整理確認後再操作。';button.disabled=false}
}
async function load(){let token=sessionStorage.getItem('chendaAdminToken');if(!token){E('status').textContent='請先返回管理中心登入管理員。';E('content').hidden=true;return}E('status').textContent='讀取正式成績中…';try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000),response;try{response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'adminFormalExamResults',token}),signal:controller.signal})}finally{clearTimeout(timer)}let data=await response.json();if(data.code==='ADMIN_SESSION_EXPIRED'){sessionStorage.removeItem('chendaAdminToken');throw Error('管理員登入已失效，請返回管理中心重新登入。')}if(!response.ok||!data.ok||!Array.isArray(data.rows))throw Error('正式成績目前無法讀取，請稍後重試。');all=data.rows;E('content').hidden=false;E('status').textContent='已取得 '+all.length+' 筆正式考試紀錄；另有 '+data.legacyRows+' 筆舊版歷史測驗未混入統計。';render()}catch(e){all=[];E('rows').replaceChildren();E('detail').textContent='';E('content').hidden=true;E('status').textContent=e.name==='AbortError'?'讀取逾時，請重新整理。':(e.message||'連線失敗，請稍後重試。')}}E('course').onchange=render;E('search').oninput=render;E('refresh').onclick=load;load();
</script></body></html>
